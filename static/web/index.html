<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>drevo browser</title>
  <link rel="stylesheet" href="/ui/styles.css" />
  <!--
    Cytoscape.js (v3.30.2) is VENDORED same-origin under /ui/vendor/ and
    baked into the drevo-server binary — it is NOT loaded from a public
    CDN. A CDN load (the old unpkg.com setup) silently breaks the WebUI
    wherever the CDN is unreachable: offline boxes, locked-down networks,
    and privacy browsers (Brave Shields blocks unpkg by default), leaving
    the graph canvas stuck on "connecting…". Same-origin assets make the
    container self-contained. No build step, no bundler, no npm tree.
    The bundles live in static/web/vendor/ and are wired in src/web_ui.rs.
  -->
  <script src="/ui/vendor/cytoscape.min.js"></script>
  <!--
    Phase 15 task 00093 — kinetics. The fcose ("fast Compound Spring
    Embedder") physics layout is a Cytoscape extension. Its UMD bundle
    auto-registers against the global `cytoscape` as long as it loads
    after the core, and it pulls in `cose-base` → `layout-base`, so the
    three must load in dependency order: layout-base, cose-base, fcose.
    All vendored locally (v2.0.1 / v2.2.0 / v2.2.0).
  -->
  <script src="/ui/vendor/layout-base.js"></script>
  <script src="/ui/vendor/cose-base.js"></script>
  <script src="/ui/vendor/cytoscape-fcose.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">drevo browser</div>
    <form id="search-form" class="search">
      <input type="text" id="search-input" name="query"
             placeholder="Full-text search (FTS)…"
             autocomplete="off" />
      <button type="submit">Search</button>
    </form>
    <div class="server-info" id="server-info">connecting…</div>
  </header>

  <main class="layout">
    <!-- Left rail: FTS results pane. Populated on submit. -->
    <aside class="results-pane" id="results-pane">
      <h2>Results</h2>
      <ol id="results-list" class="results-list">
        <li class="results-empty">Type a query above to begin.</li>
      </ol>
    </aside>

    <!-- Graph canvas: Cytoscape.js renders here. The tooltip is an
         absolutely-positioned child that app.js moves + fills on
         node hover (task 00093). -->
    <section class="graph-canvas" id="cy">
      <div id="cy-tooltip" class="cy-tooltip" role="tooltip" aria-hidden="true"></div>
    </section>

    <!-- Right rail: node inspector. Shows when a node is clicked. -->
    <aside class="inspector" id="inspector">
      <h2>Node inspector</h2>
      <div id="inspector-body" class="inspector-body">
        <p class="inspector-empty">
          Click a node in the canvas to view its properties.
        </p>
      </div>
    </aside>
  </main>

  <footer class="statusbar" id="statusbar">
    <span id="status-text">Ready.</span>
    <span class="hint">Tip: click a result to load its 2-hop subgraph; double-click a node to expand its neighbours.</span>
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
