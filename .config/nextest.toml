# cargo-nextest profile configuration.
#
# This file currently declares one non-default profile: `ci-fast`.
#
# Why `ci-fast` exists
# --------------------
# PR-gating CI runs a serialised pipeline on a single self-hosted runner
# (check + test + clippy + fmt + doc + msrv + k8s + fuzz, plus parallel
# cross-compile.yml, docker-publish.yml, python-ci.yml, python-wheels.yml
# jobs sharing the same runner queue). PR #77 already removed criterion
# benches from the `test` job; even so, a handful of integration-test
# binaries cumulate several minutes each (proptest fixtures with 256-1024
# cases each, a 5 000-write redb compaction probe, the WAL crash-recovery
# suite, and the four `*_bench`-suffixed binaries that build hundreds of
# nodes per test). On a busy runner queue with multiple PRs in flight the
# user-observed worst case has been roughly four hours of wait + run time.
#
# `ci-fast` is a **temporary** profile that skips those slow binaries via
# `default-filter` so the PR pipeline returns sub-minute test feedback.
# The full suite still runs:
#
#   * Locally — `cargo nextest run --no-fail-fast` (no profile flag, so
#     nextest picks `default` and runs everything, including the slow
#     binaries listed below). Contributors keep TDD coverage end-to-end.
#   * In the nightly `bench.yml` workflow — covers perf regression on
#     the same self-hosted runner outside the PR critical path.
#
# Re-enablement
# -------------
# Task `00129` in the README ("re-enable slow CI tests in PR pipeline")
# tracks removing this profile and the `--profile ci-fast` switch in
# `.github/workflows/ci.yml`. When that task lands, delete this file
# entirely — the structural tests in
# `tests/ci_self_hosted_runner_tests.rs` are the canary that will fail
# if the contract drifts before then.
#
# Contract locked in by tests
# ---------------------------
# `tests/ci_self_hosted_runner_tests.rs` carries the following invariants:
#
#   * `nextest_config_file_exists`
#   * `nextest_config_declares_ci_fast_profile`
#   * `nextest_config_ci_fast_profile_has_default_filter_excluding_slow_binaries`
#   * `ci_yml_test_job_runs_nextest_with_ci_fast_profile`
#   * `readme_documents_temporary_ci_fast_disable`
#
# Keep the binary list below byte-equivalent to
# `SLOW_BINARIES_GATED_FROM_CI_FAST` in that test file.

[profile.ci-fast]
# `default-filter` is applied when nextest is invoked without an explicit
# filterset on the command line. The `!(binary(...) | binary(...))` form
# excludes every listed integration-test binary by name. Each name matches
# `tests/<name>.rs`. To re-enable a single suite on CI, remove its entry
# both here and from `SLOW_BINARIES_GATED_FROM_CI_FAST` in
# `tests/ci_self_hosted_runner_tests.rs`.
default-filter = """
not (
  binary(proptest_graph_invariants)
  | binary(proptest_fts_tokenizer)
  | binary(proptest_model_serialization)
  | binary(compaction_tests)
  | binary(wal_crash_recovery_tests)
  | binary(fts_bench_tests)
  | binary(graph_bench_tests)
  | binary(traversal_bench_tests)
)
"""
