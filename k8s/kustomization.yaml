# drevo — top-level Kustomize wrapper.
#
# Phase 8 tasks 00049 (base manifests) + 00050 (overlays). This thin
# wrapper preserves the historical `kubectl apply -k k8s/` ergonomics
# while the base manifests live under `k8s/base/` (the layout the
# kustomize convention expects so per-env overlays under
# `k8s/overlays/<env>/` can reference them via `../../base/` without
# tripping kustomize's load-restrictor security check).
#
# If you do not need per-env patches, this still applies the same
# Deployment + Service + PVC trio as before.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./base/
