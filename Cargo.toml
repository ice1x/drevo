[package]
name = "graphnote-db"
version = "0.1.0"
edition = "2021"
description = "Embedded graph database for cross-platform knowledge management"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
redb = "2"

[dev-dependencies]
tempfile = "3"
