[package]
name = "graphnote-db"
version = "0.1.0"
edition = "2021"
description = "Embedded graph database for cross-platform knowledge management"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
redb = "2"
uuid = { version = "1", features = ["v7"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "storage_bench"
harness = false
