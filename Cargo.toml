[package]
name = "graphnote-db"
version = "0.1.0"
edition = "2021"
description = "Embedded graph database for cross-platform knowledge management"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
redb = { version = "2", optional = true }
uuid = { version = "1", features = ["v7", "rng-getrandom"] }
getrandom = { version = "0.4", optional = true }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower = { version = "0.5", optional = true }

[build-dependencies]
cbindgen = { version = "0.27", optional = true }

[features]
default = ["redb-backend", "cbindgen", "http"]
redb-backend = ["redb"]
wasm = ["wasm-bindgen", "js-sys", "getrandom/wasm_js"]
http = ["dep:axum", "dep:tokio", "dep:tower"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "graphnote-server"
path = "src/bin/server.rs"
required-features = ["http", "redb-backend"]

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "fts_bench"
harness = false

[[bench]]
name = "traversal_bench"
harness = false
