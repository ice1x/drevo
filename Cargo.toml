# --- Workspace ---------------------------------------------------------------
#
# Phase 16 task `00115` introduces a second crate — `drevo-py` — that wraps
# the `drevo` library through PyO3. Promoting the repo to a Cargo workspace
# lets the Python binding live in a sibling directory without forking the
# build graph (`Cargo.lock` stays unified; `cargo check -p drevo-py` works
# out of the box).
#
# `default-members = ["."]` deliberately omits `drevo-py`. Reason: PyO3
# requires a Python interpreter at build time (extension-module link
# semantics), but the project's existing CI runners (`.github/workflows/ci.yml`)
# do not provision Python. Keeping `drevo-py` *out* of the default set
# means `cargo check`, `cargo build`, `cargo nextest run`, `cargo clippy
# --all-targets`, `cargo doc` — every invocation in CI today — continue
# to operate only on the root `drevo` crate, so this PR adds Python
# bindings without regressing existing gates.
#
# Building the Python wheel happens explicitly via `maturin develop` /
# `maturin build` (introduced in Phase 16 task `00116`) and a dedicated
# Python CI matrix (task `00122`). Until those land, contributors who
# want to compile `drevo-py` locally run `cargo build -p drevo-py`
# with a Python install on PATH.
[workspace]
members = [".", "drevo-py"]
default-members = ["."]
resolver = "2"

# --- Build profiles ----------------------------------------------------------
#
# CI compile-time optimisation (and a local-dev win too). The default `dev`
# profile emits FULL debuginfo (`debug = 2`); on macOS that triggers a
# per-binary `dsymutil` pass (`split-debuginfo = "unpacked"`). With ~25
# integration-test binaries (each `tests/*.rs` links its own binary) the
# `Test` CI job spent most of its wall-clock *generating + linking debuginfo*,
# not running tests — and the single self-hosted runner made that the
# dominant, serialised cost (multi-hour `Test` jobs). `debug = 1` keeps line
# tables — so panics / backtraces still carry `file:line` — while dropping the
# expensive type/variable debuginfo, cutting compile + link time materially
# across every cargo invocation. `[profile.test]` inherits from `dev`, so the
# unit + integration builds get it too; `[profile.bench]` (release-derived) is
# untouched, so criterion still measures an optimised binary.
#
# Why here and not a CI env var: five workflows
# (ci / slow-tests / bench / cross-compile / python-ci) share ONE persistent
# `$CARGO_TARGET_DIR` on the runner. A per-workflow `RUSTFLAGS`/profile flag
# would give each a different build fingerprint, so they would thrash the
# shared cache — rebuilding the whole graph from scratch on every alternation.
# A workspace profile is the single source of truth every cargo invocation
# honours identically, on CI and locally. Locked by
# `tests/crosscut_audit_tests.rs::cargo_toml_dev_profile_trims_debuginfo`.
[profile.dev]
debug = 1  # line tables only — keeps backtrace file:line, drops full debuginfo

[package]
name = "drevo"
version = "0.1.0"
edition = "2021"
# MSRV — locked in by audit task 00113. Bumped to 1.85 because:
#   * bincode 2.x requires 1.85+
#   * axum 0.8 requires 1.85+
#   * redb 2.x requires 1.66+ but tracks the resolver-2 features that
#     landed in 1.85
# `cargo +1.85 check --all-features` is exercised by the `msrv` CI job
# and by the `cargo_toml_declares_rust_version` test in
# `tests/crosscut_audit_tests.rs`.
rust-version = "1.85"
description = "Embedded graph database for cross-platform knowledge management"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
redb = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "v7", "rng-getrandom"] }
getrandom = { version = "0.4", optional = true }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
# `js-sys` is needed in two independent situations, so it is declared twice:
#  * optional + in the `wasm` feature → `src/wasm.rs`'s `js_sys::JSON` bindings
#    compile (and lint under `--all-features`) on any target.
#  * unconditionally on wasm32 (see the `[target.'cfg(...)']` block below) →
#    `model.rs`'s clock path works even without the `wasm` feature.
js-sys = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"], optional = true }
tower = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
# Phase 11 task `00073` — TLS for Bolt. `rustls` is the only modern
# pure-Rust TLS stack (openssl-sys would defeat the "embeddable, no
# external system deps" property), `tokio-rustls` wires it into the
# same async TCP listener used by `00070`/`00071`/`00072`, and
# `rustls-pemfile` parses on-disk certificate/key PEM bundles. All
# three are gated behind the `bolt-tls` Cargo feature so default
# builds (and every CI gate that doesn't opt in) keep their dep
# graph unchanged. The `ring` crypto provider is picked over
# `aws-lc-rs` because it builds without a C toolchain (the existing
# Rust-only build matrix is the constraint).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
# Phase 11 task `00074` — authentication for Bolt. `argon2` is the
# modern, pure-Rust password-hashing standard (Argon2id), so the user
# table stores PHC-format salted hashes — never plaintext or an
# unsalted digest. It is pure Rust (no C toolchain, preserving the
# "embeddable, no external system deps" property) and is gated behind
# the `bolt-auth` Cargo feature so default builds (and every CI gate
# that doesn't opt in) keep their dependency graph unchanged. The
# `Authenticator` trait + `AuthOutcome` in `src/bolt/auth.rs` are
# dependency-free and always compiled; only the argon2-backed
# `UserStore` is feature-gated.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand", "std"], optional = true }
# Phase 19 task `00217` — OpenAI-compatible `/v1/embeddings` proxy. `reqwest`
# is the HTTP client used to forward embeddings requests to a configured
# upstream (OpenAI/Ollama/vLLM/…). It is gated behind the `embeddings-proxy`
# Cargo feature so default builds (and every CI gate that doesn't opt in) keep
# their dependency graph unchanged — the endpoint itself, its types, and the
# `503 not-configured` path are dependency-free and always compiled with
# `http`. TLS is pinned to `rustls` on the pure-Rust `ring` provider (via
# `rustls-tls-manual-roots` + `webpki-roots`), matching the `bolt-tls` choice
# so enabling the proxy never introduces a C toolchain (no `aws-lc-rs`).
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "rustls-tls-webpki-roots"], optional = true }
# MSRV guard for the `embeddings-proxy` transitive graph. `reqwest` pulls
# `url` → `idna` → `idna_adapter`, and `idna_adapter` 1.2.1+ requires `icu`
# 2.2+, which bumps the required rustc to 1.86 — above drevo's pinned MSRV
# (1.85, locked by the `msrv` CI job `cargo +1.85 check --all-features`).
# Pinning `idna_adapter` to `=1.2.0` keeps that path on the `icu` 1.5 line
# (rustc 1.67), so the msrv job stays green. Without this, a future
# `cargo update` would silently re-resolve to `icu` 2.2 and red the msrv gate.
# There is no `use idna_adapter` in this crate — it is a reqwest transitive we
# only pin — so it is listed in the cargo-machete `ignored` set below, exactly
# as `getrandom` is. Gated on `embeddings-proxy` so default builds never see it.
idna_adapter = { version = "=1.2.0", optional = true }

[build-dependencies]
cbindgen = { version = "0.27", optional = true }

[features]
default = ["redb-backend", "cbindgen", "http"]
redb-backend = ["redb"]
wasm = ["wasm-bindgen", "js-sys", "getrandom/wasm_js"]
http = ["dep:axum", "dep:tokio", "dep:tower", "dep:tracing", "dep:tracing-subscriber"]
# Phase 11 task `00073` — Bolt over TLS. Compiles `src/bolt/tls.rs`
# and the `_tls` variants of the listener entry points. Implies
# `http` because TLS is meaningless without the TCP listener (which
# is itself gated on `http`).
bolt-tls = ["http", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
# Phase 11 task `00074` — authentication for Bolt. Compiles the
# argon2-backed `UserStore` in `src/bolt/auth.rs` (basic auth +
# session tokens + user table). Does NOT imply `http`: the auth
# logic + `run_session_sync_with_auth` driver are transport-agnostic
# (plain `std::io::Read`/`Write`); the async listener `_with_auth`
# entry points are independently gated on `http`.
bolt-auth = ["dep:argon2"]

# Phase 19 task `00217` — OpenAI-compatible `/v1/embeddings`. The endpoint,
# its request/response types, the SSRF-safe config, and the `503
# not-configured` path are always compiled with `http` (no extra deps). This
# feature adds the `reqwest`-backed proxy backend that forwards to a configured
# upstream (OpenAI/Ollama/…). Opt-in so the default binary stays lean; implies
# `http` because the proxy is only reachable through the HTTP endpoint.
embeddings-proxy = ["http", "dep:reqwest", "dep:idna_adapter"]

# `js-sys` is the clock source for `now_ms`/`new_uuid_v7` on wasm32, where
# `std::time::SystemTime::now()` aborts (see `model.rs`, drevo#198). It is
# needed on every wasm32 build regardless of the `wasm` feature — hence this
# unconditional target-specific declaration, in addition to the optional
# `wasm`-feature one above (which covers `src/wasm.rs` on non-wasm targets).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# `proptest` powers Phase 9 task `00057` — property-based tests for graph
# invariants, FTS tokenizer round-trips, and model serialization. Test-only;
# never compiled into the library, FFI, or WASM artifact. `default-features
# = false` keeps the dependency tree minimal — no `fork`, no `timeout`, no
# `regex` — which matters because the proptest harness must run on the same
# MSRV (1.85) and CI matrix as the rest of the test suite.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# `rcgen` powers Phase 11 task `00073` — generates a self-signed
# certificate + PKCS#8 private key in-memory at test time so the
# Bolt TLS integration tests don't need a checked-in PEM bundle
# (which would otherwise need rotation or pin a real authority).
# Test-only; never compiled into the library, FFI, or WASM artifact.
rcgen = "0.13"

[[bin]]
name = "drevo-server"
path = "src/bin/server.rs"
required-features = ["http", "redb-backend"]

# NOTE: the embedded `drevo-mcp` stdio MCP server (former Phase 15 task
# `00090`) was removed — its in-process model opened the redb file
# directly and fought `drevo-server` for redb's single-process lock. The
# MCP server now lives in a separate repository
# (https://github.com/ice1x/drevo-mcp) and talks to a running
# `drevo-server` over HTTP / Bolt, so it never contends for the file.

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "fts_bench"
harness = false

[[bench]]
name = "traversal_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

# `getrandom` has no direct `use getrandom::...` site in this crate — it is
# declared as an optional dependency solely so that the `wasm` feature can
# write `getrandom/wasm_js` and surface the browser-RNG feature flag on the
# same `getrandom` version that `uuid` v1 already pulls in transitively.
# Audit task `00113` (`tests/crosscut_audit_tests.rs::getrandom_marked_as_ignored_...`)
# locks the rationale into a test so a future contributor cannot delete the
# dep without first asserting that `cargo build --target wasm32-unknown-unknown
# --no-default-features --features wasm` still emits a `getrandom` with
# `wasm_js` enabled.
# `idna_adapter` is declared only to pin the `embeddings-proxy` transitive
# graph to an MSRV-1.85-compatible `icu` (see the dependency comment above);
# it has no direct `use` site, so cargo-machete would otherwise flag it.
[package.metadata.cargo-machete]
ignored = ["getrandom", "idna_adapter"]
