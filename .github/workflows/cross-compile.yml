name: Cross-Compilation

# Docs-only changes bypass this workflow via `paths-ignore` on the
# `push:main` trigger. The set MUST stay byte-identical to ci.yml's
# and docker-publish.yml's paths-ignore set — locked by
# `tests/ci_self_hosted_runner_tests.rs::heavy_workflows_share_docs_only_paths_ignore`.
#
# Why no `pull_request:` trigger
# ------------------------------
# Earlier revisions ran the WASM / iOS / Android / cross-tests /
# smoke / macos-smoke set on every PR. The Android job in particular
# downloads ~1 GiB of NDK from dl.google.com on every cold run, and
# any upstream network flake on `curl` to `dl.google.com` would block
# the PR with no legitimate code reason — PR #81 (a README-only
# roadmap PR) hit exactly that mode before the docs-only paths-ignore
# guard landed. Beyond Android, the value the per-PR matrix added was
# small: cross-target regressions are rare and ci.yml's `msrv` job
# already exercises `wasm32-unknown-unknown` on every PR, which is
# our primary cross-target. The remaining cells (iOS, Android, native
# smoke) now run on `push:main` (so a real regression is caught on
# the very next merge into main, before the next PR rebases on top)
# and twice a week via `schedule:` (so a slow upstream change is
# caught between merges). Manual `workflow_dispatch` is available
# when a PR genuinely needs the cross-target validation before merge.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'audit/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # 06:00 UTC every other day — one hour after slow-tests.yml at
    # 05:00 UTC, two hours after bench.yml at 04:00 UTC. The three
    # scheduled workflows therefore queue in series on the single
    # self-hosted runner without colliding.
    - cron: '0 6 */2 * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CARGO_TARGET_DIR is set by a setup step inside each job (see ci.yml's
  # comment for the full rationale — `runner.*` context is only valid at
  # step level, not in workflow- or job-level `env:` blocks).

jobs:
  # -------------------------------------------------------------------------
  # WASM target: wasm32-unknown-unknown
  # -------------------------------------------------------------------------
  wasm:
    name: "WASM (wasm32-unknown-unknown)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # No `Swatinem/rust-cache@v2` here — the per-job setup step at the
      # top of this job exported `CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/
      # drevo-cargo-target` into `$GITHUB_ENV`, which keeps the compiled
      # `target/` directory at a persistent location between runs on the
      # self-hosted runner, so cargo's native incremental build is the
      # cache. Layering Swatinem on top would replace the locally-
      # incremental state with whatever snapshot last got uploaded to
      # the GHA cache backend (older, by definition), which is the
      # opposite of what we want here.

      # Check: compile for WASM (no default features, wasm feature enabled)
      - name: cargo check (WASM)
        run: >
          cargo check
          --target wasm32-unknown-unknown
          --no-default-features
          --features wasm
          --lib

      # Build: produce cdylib for WASM consumers
      - name: cargo build (WASM)
        run: >
          cargo build
          --target wasm32-unknown-unknown
          --no-default-features
          --features wasm
          --lib

      # Verify the .wasm artifact exists
      - name: Verify WASM artifact
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/debug/drevo.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "ERROR: WASM artifact not found at $WASM_FILE"
            ls -la target/wasm32-unknown-unknown/debug/ || true
            exit 1
          fi
          echo "WASM artifact size: $(du -h "$WASM_FILE" | cut -f1)"

  # -------------------------------------------------------------------------
  # iOS target: aarch64-apple-ios
  # -------------------------------------------------------------------------
  ios:
    name: "iOS (aarch64-apple-ios)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # See WASM job — per-job setup step exporting `CARGO_TARGET_DIR` replaces Swatinem.

      # Check: compile for iOS with default features (redb + cbindgen)
      - name: cargo check (iOS)
        run: >
          cargo check
          --target aarch64-apple-ios
          --lib

      # Build: produce staticlib for iOS embedding
      - name: cargo build (iOS)
        run: >
          cargo build
          --target aarch64-apple-ios
          --lib

      # Verify the static library artifact exists
      - name: Verify iOS artifact
        run: |
          LIB_FILE="target/aarch64-apple-ios/debug/libdrevo.a"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: iOS static library not found at $LIB_FILE"
            ls -la target/aarch64-apple-ios/debug/ || true
            exit 1
          fi
          echo "iOS static library size: $(du -h "$LIB_FILE" | cut -f1)"

      # Verify the C header is generated
      - name: Verify C header
        run: |
          if [ ! -f "drevo.h" ]; then
            echo "ERROR: drevo.h not generated"
            exit 1
          fi
          echo "drevo.h generated successfully"
          head -20 drevo.h

  # -------------------------------------------------------------------------
  # Android target: aarch64-linux-android
  # -------------------------------------------------------------------------
  android:
    name: "Android (aarch64-linux-android)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # See WASM job — per-job setup step exporting `CARGO_TARGET_DIR` replaces Swatinem.

      # Install Android NDK linker — host-OS aware.
      #
      # On GitHub-hosted runners the workflow always ran on
      # `ubuntu-latest` so the hard-coded `-linux.zip` archive worked
      # unconditionally. On a self-hosted runner the host can be macOS
      # (the project's developer baseline — see README "Performance
      # Targets"), in which case we need the `darwin` NDK archive and
      # the `darwin-x86_64` toolchain subdir instead. The Apple Silicon
      # NDK ships as the same `darwin` archive (the prebuilt subdir is
      # named `darwin-x86_64` even on arm64 hosts — that's Rosetta-2
      # transparency, not a typo).
      #
      # Idempotency: `unzip -o` overwrites without prompting so a
      # re-run after a previous extraction does not block on the
      # interactive `replace …? [y]es, [n]o, [A]ll …` question that
      # broke past runs.
      #
      # Caching: the NDK is ~1 GiB unzipped. On the self-hosted runner
      # the workspace is wiped between jobs (actions/checkout cleans it),
      # but `$RUNNER_TOOL_CACHE` is a stable per-runner directory that
      # survives across jobs / runs — exactly what the GitHub-Hosted
      # runners use for `$RUNNER_TOOL_CACHE/Python/3.12.X/x64`,
      # `$RUNNER_TOOL_CACHE/node/20.X/x64`, etc. Caching the NDK there
      # keyed by version means the curl-to-dl.google.com only runs once
      # per NDK version bump (next bump: edit `ANDROID_NDK_VERSION`,
      # next run repopulates). On a fresh runner with no cache the
      # download path is unchanged.
      - name: Install Android NDK (cached on self-hosted runner)
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="r27c"
          case "$(uname -s)" in
            Linux*)
              NDK_HOST_TAG="linux"
              NDK_PREBUILT_DIR="linux-x86_64"
              ;;
            Darwin*)
              NDK_HOST_TAG="darwin"
              NDK_PREBUILT_DIR="darwin-x86_64"
              ;;
            *)
              echo "Unsupported host OS: $(uname -s)" >&2
              exit 1
              ;;
          esac
          # `$RUNNER_TOOL_CACHE` is set by the Actions runner agent on
          # both hosted and self-hosted runners. Fall back to
          # `$HOME/.cache` for any non-runner-managed environment.
          NDK_PARENT="${RUNNER_TOOL_CACHE:-$HOME/.cache}/drevo-ndk"
          mkdir -p "$NDK_PARENT"
          NDK_DIR="$NDK_PARENT/android-ndk-${ANDROID_NDK_VERSION}"
          NDK_LINKER="$NDK_DIR/toolchains/llvm/prebuilt/${NDK_PREBUILT_DIR}/bin/aarch64-linux-android35-clang"
          if [ -x "$NDK_LINKER" ]; then
            echo "NDK ${ANDROID_NDK_VERSION} already cached at $NDK_DIR — skipping download"
          else
            echo "::group::NDK ${ANDROID_NDK_VERSION} not cached — downloading to $NDK_PARENT"
            NDK_URL="https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-${NDK_HOST_TAG}.zip"
            # Use curl on macOS (no wget by default); curl is also on
            # every Linux distro we'd run this on.
            tmp_zip="$(mktemp -t ndk-XXXXXX.zip)"
            trap 'rm -f "$tmp_zip"' EXIT
            curl -fsSL "$NDK_URL" -o "$tmp_zip"
            unzip -qo "$tmp_zip" -d "$NDK_PARENT"
            echo "::endgroup::"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_PREBUILT_DIR=$NDK_PREBUILT_DIR" >> "$GITHUB_ENV"

      # Configure cargo to use Android NDK linker. The toolchain
      # subdir name comes from the previous step's `NDK_PREBUILT_DIR`
      # export so the workflow stays host-OS agnostic.
      - name: Configure Android linker
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android35-clang"
          EOF
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$NDK_PREBUILT_DIR/bin" >> $GITHUB_PATH

      # Check: compile for Android (no cbindgen in cross-compile, redb enabled)
      - name: cargo check (Android)
        run: >
          cargo check
          --target aarch64-linux-android
          --no-default-features
          --features redb-backend
          --lib

      # Build: produce shared library for Android
      - name: cargo build (Android)
        run: >
          cargo build
          --target aarch64-linux-android
          --no-default-features
          --features redb-backend
          --lib

      # Verify the shared library artifact exists
      - name: Verify Android artifact
        run: |
          SO_FILE="target/aarch64-linux-android/debug/libdrevo.so"
          STATIC_FILE="target/aarch64-linux-android/debug/libdrevo.a"
          if [ -f "$SO_FILE" ]; then
            echo "Android shared library size: $(du -h "$SO_FILE" | cut -f1)"
          elif [ -f "$STATIC_FILE" ]; then
            echo "Android static library size: $(du -h "$STATIC_FILE" | cut -f1)"
          else
            echo "WARNING: No library artifact found, listing debug dir:"
            ls -la target/aarch64-linux-android/debug/libdrevo* 2>/dev/null || echo "No libdrevo* files"
            ls -la target/aarch64-linux-android/debug/ | head -20
          fi

  # -------------------------------------------------------------------------
  # Native host tests (verify cross-compilation test suite)
  # -------------------------------------------------------------------------
  cross-compile-tests:
    name: "Cross-compilation tests (host)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # See WASM job — per-job setup step exporting `CARGO_TARGET_DIR` replaces Swatinem.

      - name: Run cross-compilation tests
        run: cargo test --test cross_compilation_tests -- --nocapture

  # -------------------------------------------------------------------------
  # Platform smoke tests (host — validates full workflow on all backends)
  # -------------------------------------------------------------------------
  smoke-tests:
    name: "Platform smoke tests (host)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # See WASM job — per-job setup step exporting `CARGO_TARGET_DIR` replaces Swatinem.

      - name: Run platform smoke tests
        run: cargo test --test smoke_tests -- --nocapture

  # -------------------------------------------------------------------------
  # macOS smoke tests (validates on Apple Silicon host)
  # -------------------------------------------------------------------------
  smoke-tests-macos:
    name: "Platform smoke tests (macOS)"
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # See WASM job — per-job setup step exporting `CARGO_TARGET_DIR` replaces Swatinem.

      - name: Run platform smoke tests (macOS)
        run: cargo test --test smoke_tests -- --nocapture
