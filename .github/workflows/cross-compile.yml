name: Cross-Compilation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # WASM target: wasm32-unknown-unknown
  # -------------------------------------------------------------------------
  wasm:
    name: "WASM (wasm32-unknown-unknown)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # Check: compile for WASM (no default features, wasm feature enabled)
      - name: cargo check (WASM)
        run: >
          cargo check
          --target wasm32-unknown-unknown
          --no-default-features
          --features wasm
          --lib

      # Build: produce cdylib for WASM consumers
      - name: cargo build (WASM)
        run: >
          cargo build
          --target wasm32-unknown-unknown
          --no-default-features
          --features wasm
          --lib

      # Verify the .wasm artifact exists
      - name: Verify WASM artifact
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/debug/drevo.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "ERROR: WASM artifact not found at $WASM_FILE"
            ls -la target/wasm32-unknown-unknown/debug/ || true
            exit 1
          fi
          echo "WASM artifact size: $(du -h "$WASM_FILE" | cut -f1)"

  # -------------------------------------------------------------------------
  # iOS target: aarch64-apple-ios
  # -------------------------------------------------------------------------
  ios:
    name: "iOS (aarch64-apple-ios)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      # Check: compile for iOS with default features (redb + cbindgen)
      - name: cargo check (iOS)
        run: >
          cargo check
          --target aarch64-apple-ios
          --lib

      # Build: produce staticlib for iOS embedding
      - name: cargo build (iOS)
        run: >
          cargo build
          --target aarch64-apple-ios
          --lib

      # Verify the static library artifact exists
      - name: Verify iOS artifact
        run: |
          LIB_FILE="target/aarch64-apple-ios/debug/libdrevo.a"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: iOS static library not found at $LIB_FILE"
            ls -la target/aarch64-apple-ios/debug/ || true
            exit 1
          fi
          echo "iOS static library size: $(du -h "$LIB_FILE" | cut -f1)"

      # Verify the C header is generated
      - name: Verify C header
        run: |
          if [ ! -f "drevo.h" ]; then
            echo "ERROR: drevo.h not generated"
            exit 1
          fi
          echo "drevo.h generated successfully"
          head -20 drevo.h

  # -------------------------------------------------------------------------
  # Android target: aarch64-linux-android
  # -------------------------------------------------------------------------
  android:
    name: "Android (aarch64-linux-android)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # Install Android NDK linker — host-OS aware.
      #
      # On GitHub-hosted runners the workflow always ran on
      # `ubuntu-latest` so the hard-coded `-linux.zip` archive worked
      # unconditionally. On a self-hosted runner the host can be macOS
      # (the project's developer baseline — see README "Performance
      # Targets"), in which case we need the `darwin` NDK archive and
      # the `darwin-x86_64` toolchain subdir instead. The Apple Silicon
      # NDK ships as the same `darwin` archive (the prebuilt subdir is
      # named `darwin-x86_64` even on arm64 hosts — that's Rosetta-2
      # transparency, not a typo).
      #
      # Idempotency: `unzip -o` overwrites without prompting so a
      # re-run after a previous extraction does not block on the
      # interactive `replace …? [y]es, [n]o, [A]ll …` question that
      # broke past runs.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="r27c"
          case "$(uname -s)" in
            Linux*)
              NDK_HOST_TAG="linux"
              NDK_PREBUILT_DIR="linux-x86_64"
              ;;
            Darwin*)
              NDK_HOST_TAG="darwin"
              NDK_PREBUILT_DIR="darwin-x86_64"
              ;;
            *)
              echo "Unsupported host OS: $(uname -s)" >&2
              exit 1
              ;;
          esac
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-${NDK_HOST_TAG}.zip"
          # Use curl on macOS (no wget by default); curl is also on
          # every Linux distro we'd run this on.
          curl -fsSL "$NDK_URL" -o ndk.zip
          unzip -qo ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_PREBUILT_DIR=$NDK_PREBUILT_DIR" >> $GITHUB_ENV

      # Configure cargo to use Android NDK linker. The toolchain
      # subdir name comes from the previous step's `NDK_PREBUILT_DIR`
      # export so the workflow stays host-OS agnostic.
      - name: Configure Android linker
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android35-clang"
          EOF
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$NDK_PREBUILT_DIR/bin" >> $GITHUB_PATH

      # Check: compile for Android (no cbindgen in cross-compile, redb enabled)
      - name: cargo check (Android)
        run: >
          cargo check
          --target aarch64-linux-android
          --no-default-features
          --features redb-backend
          --lib

      # Build: produce shared library for Android
      - name: cargo build (Android)
        run: >
          cargo build
          --target aarch64-linux-android
          --no-default-features
          --features redb-backend
          --lib

      # Verify the shared library artifact exists
      - name: Verify Android artifact
        run: |
          SO_FILE="target/aarch64-linux-android/debug/libdrevo.so"
          STATIC_FILE="target/aarch64-linux-android/debug/libdrevo.a"
          if [ -f "$SO_FILE" ]; then
            echo "Android shared library size: $(du -h "$SO_FILE" | cut -f1)"
          elif [ -f "$STATIC_FILE" ]; then
            echo "Android static library size: $(du -h "$STATIC_FILE" | cut -f1)"
          else
            echo "WARNING: No library artifact found, listing debug dir:"
            ls -la target/aarch64-linux-android/debug/libdrevo* 2>/dev/null || echo "No libdrevo* files"
            ls -la target/aarch64-linux-android/debug/ | head -20
          fi

  # -------------------------------------------------------------------------
  # Native host tests (verify cross-compilation test suite)
  # -------------------------------------------------------------------------
  cross-compile-tests:
    name: "Cross-compilation tests (host)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-tests

      - name: Run cross-compilation tests
        run: cargo test --test cross_compilation_tests -- --nocapture

  # -------------------------------------------------------------------------
  # Platform smoke tests (host — validates full workflow on all backends)
  # -------------------------------------------------------------------------
  smoke-tests:
    name: "Platform smoke tests (host)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-tests

      - name: Run platform smoke tests
        run: cargo test --test smoke_tests -- --nocapture

  # -------------------------------------------------------------------------
  # macOS smoke tests (validates on Apple Silicon host)
  # -------------------------------------------------------------------------
  smoke-tests-macos:
    name: "Platform smoke tests (macOS)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-macos

      - name: Run platform smoke tests (macOS)
        run: cargo test --test smoke_tests -- --nocapture
