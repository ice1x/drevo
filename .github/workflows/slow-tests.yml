# Scheduled "slow tests" workflow.
#
# Sibling of bench.yml; both run on a fixed cadence (not PR-triggered)
# so the CI cost lives outside the PR critical path.
#
# What this runs
# --------------
# `cargo nextest run --no-fail-fast` against the DEFAULT profile. As of
# task `00129` the temporary `ci-fast` profile is gone, so ci.yml's
# PR-gating `test` job ALREADY runs this full set (proptest fixtures,
# `*_bench_tests`, `wal_crash_recovery_tests`, and the light compaction
# cells) on every PR. This scheduled run is therefore defence-in-depth on
# a quiet, uncontended host — not the only home for those binaries.
#
# The ONE thing this workflow runs that the PR path does not is the pair
# of heaviest redb-churn compaction cells, which 00129 left `#[ignore]`d
# to keep them off the serialised self-hosted-runner queue:
#
#   * compaction_tests::redb_backend_size_bytes_returns_file_size
#       — 5 000 fsync'd 1 KiB writes (file-growth probe)
#   * compaction_tests::redb_compact_reclaims_after_heavy_churn
#       — 500 inserts + 500 deletes + a full compaction
#
# The dedicated `--run-ignored ignored-only` step below is their nightly
# home. Local development reaches them with `cargo nextest run
# --run-ignored all` (or `cargo test -- --ignored`).
#
# Triggers
# --------
# * `schedule: cron '0 5 */2 * *'` — every other day at 05:00 UTC.
#   That's one hour after bench.yml's 04:00 UTC nightly run, so the
#   two scheduled workflows don't collide on the single self-hosted
#   runner. Cadence rationale: the slow binaries protect properties
#   that change rarely (graph invariants, FTS tokenizer round-trip,
#   redb compaction, WAL crash recovery) — running them twice a week
#   gives an early-warning signal without burning runner time daily.
# * `workflow_dispatch` — manual trigger from the Actions UI for
#   "I'm about to merge a refactor that touches FTS / storage, run
#   the slow suite now."
#
# Notably absent: `push:` and `pull_request:`. Adding either would
# re-introduce the PR-time queueing pressure the ci-fast profile
# was designed to remove.
#
# Runner & policy
# ---------------
# `runs-on: self-hosted`. The slow binaries include I/O-heavy redb
# probes and proptest fuzz-like search; results from ephemeral
# GitHub-hosted VMs would vary too much for the failure signal to
# be useful. The Apple Silicon self-hosted runner is the same host
# that bench.yml relies on for stable timings.
#
# `continue-on-error: true` so a single flaky proptest case (e.g.
# rare shrink/strategy interaction) surfaces as an advisory annotation
# rather than a hard failure on an unrelated branch — bench.yml uses
# the same policy for the same reason. When a real regression lands,
# the run is red in the Actions UI and the maintainer triages from
# there.

name: Slow tests

on:
  schedule:
    # 05:00 UTC every other day. One hour after bench.yml (04:00 UTC
    # daily) so the two scheduled workflows don't queue behind each
    # other on the single self-hosted runner.
    - cron: '0 5 */2 * *'
  workflow_dispatch:

# Cancel the older scheduled run if a newer cron (or manual dispatch)
# lands while one is still in progress. Distinct group from bench.yml
# (`bench-*`), ci.yml (`ci-real-*`), and ci-skip.yml (`ci-skip-*`).
concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  full_suite:
    name: nextest (default profile — full suite)
    runs-on: self-hosted
    # Advisory, not gating. See header comment.
    continue-on-error: true
    # timeout-minutes (added 2026-06-11): without it this job inherited
    # GitHub's 360-min default and ALWAYS hit it — the old 4-step job
    # (full suite + compaction cells + --all-features doctests + 30-min
    # soak) exceeded 6h on the contended single runner, so every nightly
    # run ended in `cancelled` with no signal while squatting the runner
    # ~6h (plus hours of queue). After trimming to just the ignored-only
    # steps below (full suite + doctests are already covered by ci.yml's
    # PR `test` job since 00129, so they were pure redundant defence-in-
    # depth that never even completed), the job finishes in well under an
    # hour; 90 is generous headroom and a hard backstop against a hang.
    timeout-minutes: 90
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Swatinem — job-level `CARGO_TARGET_DIR` above persists
      # target/ on local disk; the GHA-cache restore would replace
      # fresher local state with an older snapshot.

      # Cached cargo-nextest install (same as ci.yml's Test job): the
      # taiki-e action was observed re-resolving for ~24 min on a
      # contended run; the runner persists $HOME/.cargo/bin, so guard the
      # official get.nexte.st tarball behind `command -v`.
      - name: Install cargo-nextest (cached on self-hosted runner)
        run: |
          if command -v cargo-nextest >/dev/null 2>&1; then
            echo "cargo-nextest already installed: $(cargo-nextest --version)"
          else
            url="https://get.nexte.st/latest/mac"
            [ "$RUNNER_OS" = "Linux" ] && url="https://get.nexte.st/latest/linux"
            curl -LsSf "$url" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
            echo "installed cargo-nextest: $(cargo-nextest --version)"
          fi

      # NOTE (2026-06-11): the full default-profile run and the
      # `cargo test --doc --all-features` step that used to live here were
      # removed. ci.yml's PR `test` job already runs both on every PR
      # (since task 00129 dropped the `ci-fast` profile), so re-running
      # them nightly was pure redundant defence-in-depth — and together
      # with the soak below they pushed this job past the 6h job timeout,
      # so it ALWAYS ended `cancelled` and never produced a signal while
      # squatting the runner for ~6h. This job now runs ONLY the work that
      # has no PR home: the `#[ignore]`d heavy compaction cells and the
      # agentic-workload soak.

      # The two heaviest redb-churn compaction cells are `#[ignore]`d so they
      # stay off the serialised PR path (task 00129). `--run-ignored
      # ignored-only -E 'binary(compaction_tests)'` runs EXACTLY those two
      # ignored tests here — their nightly home — without dragging in the
      # 30-minute `#[ignore]`d agentic-workload soaks or the Docker/Neo4j-live
      # ignored tests. This is the regression signal that keeps the ignored
      # cells from rotting into a permanent skip; locked by
      # `tests/ci_self_hosted_runner_tests.rs`.
      - name: Heavy redb compaction cells (ignored on PR path — task 00129)
        run: cargo nextest run --run-ignored ignored-only --no-fail-fast -E 'binary(compaction_tests)'

      # Phase 10.5 task 00123 — layer-1 agentic workload baseline.
      # `#[ignore]` by default so it never touches the PR path; this
      # scheduled self-hosted job is its nightly-CI home (see the task's
      # README entry). Runs the 30-minute floor by default; dispatch with
      # `DREVO_SOAK_SECS=28800` for the roadmap's 8-hour soak. Advisory —
      # the job-level `continue-on-error: true` above means a perf-envelope
      # breach annotates the run rather than hard-failing an unrelated branch.
      - name: agentic workload baseline soak (layer 1)
        run: cargo nextest run --run-ignored ignored-only --no-fail-fast
          -E 'test(rust_api_agentic_workload_soak)' --nocapture
