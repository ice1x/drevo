# Phase 16 task `00116` — Python wheel build matrix.
#
# Drives `cibuildwheel` over the platform / CPython matrix declared in
# the cross-cutting acceptance criteria of README.md §"Phase 16 — Python
# Graph-RAG SDK":
#
#   cp310 / cp311 / cp312 / cp313  ×  Ubuntu / macOS / Windows
#
# Each leaf builds a wheel via `maturin` (the build backend declared in
# `drevo-py/pyproject.toml`) and runs `twine check dist/*` to validate
# wheel metadata. The job uploads built wheels as a workflow artifact so
# a downstream release step (separate task — not part of `00116`) can
# fetch them when the time comes to publish to PyPI.
#
# **No publishing.** Task `00116` explicitly defers package uploads:
# the matrix exists so wheel build regressions are caught on every PR,
# but the release flow lands later once `00122` makes the Python CI
# matrix the gating check. A scaffolding test in
# `tests/python_package_wheels_tests.rs` asserts this file invokes
# neither the upload subcommand nor the official upload action — flip
# those guards at release-task time, not before.
#
# **Not on branch protection yet.** The job is wired to PR + manual
# dispatch but not yet listed in branch protection's required-checks
# set. Task `00122` promotes it once the Python CI matrix lands the
# full unit / integration / e2e test layers; until then, a red wheel
# build surfaces as an advisory.

name: Python wheels

on:
  push:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python-wheels.yml'
      - 'Cargo.lock'
  workflow_dispatch:
  # PR trigger intentionally absent. cibuildwheel + twine check on
  # every PR was a significant slice of the multi-hour CI wait
  # observed on this repo. PRs already get fast Python feedback from
  # `python-ci.yml` (self-hosted, ~1-2 min). Wheel builds re-exercise
  # on every push to `main` (now zero billable cost — see below) and
  # on demand via `workflow_dispatch`, which is the right cadence
  # because there is no PyPI publish on PR — the only consumer of
  # these wheels is the future release task.
  #
  # **Path-filter scope** narrowed on 2026-05-27 from
  # `src/**` + `Cargo.toml` + `Cargo.lock` to just `Cargo.lock`. The
  # PyO3 surface in drevo-py/src/handle.rs only exposes the embedded
  # graph + traversal + FTS subset of drevo core; Cypher / FFI /
  # WASM / server / CLI changes in `src/**` never affect the wheel
  # ABI. `Cargo.lock` is retained because a transitive dep bump can
  # legitimately change the produced wheel. This keeps wheel rebuilds
  # to "the Python surface actually changed" instead of "anything in
  # the Rust crate moved", which was the path that fired 6 main
  # merges × 12 hosted cells = ~3,120 billable minutes during the
  # Phase 10 Cypher merge burst (see KG
  # `incident_2026_05_27_ci_minutes_burn`).

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build macOS wheels (self-hosted)
    # Self-hosted macOS runner only. The previous matrix
    # (`ubuntu-latest, macos-latest, windows-latest` × `cp310-cp313`
    # = 12 cells) billed against GitHub-hosted infrastructure with a
    # ×10 multiplier on macOS cells and ×2 on Windows; one push to
    # main matching the path filter cost ~520 billable minutes.
    # Linux + Windows wheels need a real runner of that OS class to
    # produce a working `.so`/`.pyd` (PyO3's runtime ABI checks have
    # no cross-compile path); building them here is deferred to a
    # release-time workflow (the future task that wires
    # `release: types: [published]` and explicitly opts into
    # cross-platform GitHub-hosted minutes for the upload step).
    # Until then, this workflow validates the macOS wheel build +
    # twine metadata on every main-touching change at zero billable
    # cost — see KG `incident_2026_05_27_ci_minutes_burn` for the
    # full incident write-up.
    runs-on: self-hosted

    env:
      # Selects the wheels cibuildwheel will produce. The `cp3XY-*`
      # pattern matches every architecture cibuildwheel knows about
      # on the runner; the abi3-py310 feature in
      # `drevo-py/Cargo.toml` lets one `cp310` wheel run on every
      # later 3.x — but we build per-minor anyway so PyPI's metadata
      # records the exact set of tested versions.
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
      # Skip the platforms NOT in the documented wheel matrix
      # (README §"Phase 16 cross-cutting acceptance criteria"):
      #
      #   pp*                  — PyPy. drevo's PyO3 layer is built
      #                          against CPython's abi3-py310; PyPy
      #                          interpreters speak a different ABI.
      #   *-win32              — Windows 32-bit (`cp310-win32` etc.).
      #                          Not in the matrix; redb's memory-
      #                          mapped backend has tight 32-bit
      #                          address-space limits and the test
      #                          suite was observed to fail on win32
      #                          in PR CI (the user's PR run that
      #                          motivated this skip).
      #   *-manylinux_i686     — Linux glibc 32-bit. Same reasoning
      #                          as win32 — not in the matrix, redb
      #                          is unhappy on 32-bit.
      #   *-musllinux_i686     — Linux musl 32-bit. Same.
      #   cp*-musllinux_*      — musl Alpine wheels in general are
      #                          deferred until a downstream consumer
      #                          asks for them — manylinux glibc
      #                          covers ~all real-world deployments.
      #
      # Users on any skipped platform can still build from source via
      # `pip install drevo-py --no-binary :all:` once they have a Rust
      # toolchain on PATH.
      CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_i686 cp*-musllinux_*"
      # Force cibuildwheel to invoke `maturin` rather than its default
      # `pip wheel`. `pip wheel` would try to use a setuptools backend
      # and explode immediately — `pyproject.toml` declares maturin.
      CIBW_BUILD_FRONTEND: "build"
      # cibuildwheel runs inside its own manylinux container on Linux.
      # Install the Rust toolchain once per platform (`BEFORE_ALL`, not
      # `BEFORE_BUILD` — runs once, not per-wheel), then surface
      # `~/.cargo/bin` through `CIBW_ENVIRONMENT_LINUX` so the build
      # step actually finds cargo. The previous `BEFORE_BUILD` form
      # without an env-PATH update failed with exit code 127
      # ("rustup: command not found") because rustup-init writes the
      # binary into `$HOME/.cargo/bin` without modifying the active
      # shell's PATH — every subsequent command in the same script
      # then has to use the absolute path or re-source `cargo/env`.
      # Using BEFORE_ALL + CIBW_ENVIRONMENT_LINUX is the pattern the
      # cibuildwheel docs recommend for Rust-backed wheels.
      CIBW_BEFORE_ALL_LINUX: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal --default-toolchain stable
      CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
      # Native macOS + Windows runners get rustup from the host setup
      # step above (dtolnay/rust-toolchain@stable). No in-container
      # install needed; `rustup show` is a cheap sanity check that
      # cargo is on PATH before maturin runs.
      CIBW_BEFORE_BUILD_MACOS: "rustup show"
      CIBW_BEFORE_BUILD_WINDOWS: "rustup show"
      # Test every wheel cibuildwheel produces against the runtime
      # contract in drevo-py/tests/test_shim.py (UUID wrapping,
      # InvalidWeightError subclass, __all__ consistency, RFC §3.3
      # method enumeration, ~40 tests). The tests run in cibuildwheel's
      # isolated venv (`pip install ${wheel}`) so they exercise the
      # install path — the same one end users hit — not the dev tree.
      # pytest is installed via CIBW_TEST_REQUIRES so it does not
      # contaminate the wheel's own dependency closure.
      CIBW_TEST_REQUIRES: "pytest>=7 faker hypothesis"
      # `{package}` resolves to the package source (`drevo-py/`, the
      # directory passed on the cibuildwheel command line below);
      # `{project}` would resolve to the repo root (`drevo/`), which
      # contains the Rust integration test crate — pytest finds no
      # Python tests there and exits with code 5 ("no tests
      # collected"). `{package}/tests` correctly points at
      # `drevo-py/tests/` where the 40 shim runtime tests live.
      CIBW_TEST_COMMAND: 'pytest -q {package}/tests'

    steps:
      - uses: actions/checkout@v4
        # cibuildwheel needs the full git history to compute the
        # version when the project uses dynamic versioning. We use
        # static `version = "0.1.0"` for now, but a shallow clone
        # still trips up `maturin develop` on some Rust + cargo
        # interactions, so fetch-depth: 0 is the safe default.
        with:
          fetch-depth: 0

      - name: Locate system Python 3.13 on self-hosted macOS
        # `actions/setup-python@v5` cannot install into
        # `/Users/runner/hostedtoolcache/` under the self-hosted runner's
        # user — it runs `mkdir /Users/runner` and dies with "Permission
        # denied", which is exactly what turned this workflow red on
        # 2026-07-01. Same shim `python.yml` / `python-ci.yml` use: locate
        # the python.org-pkg 3.13 binary and symlink it as `python` /
        # `python3` in a `$GITHUB_WORKSPACE/.py-shim` dir prepended to
        # `$GITHUB_PATH`. cibuildwheel uses the host Python only to
        # orchestrate; the wheel Python is managed by cibuildwheel itself.
        shell: bash
        run: |
          for candidate in \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13" \
            "$(command -v python3.13 || true)" \
            "/opt/homebrew/bin/python3.13" \
            "/usr/local/bin/python3.13"; do
            if [ -x "$candidate" ]; then
              echo "Using $candidate ($($candidate --version))"
              mkdir -p "$GITHUB_WORKSPACE/.py-shim"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python3"
              echo "$GITHUB_WORKSPACE/.py-shim" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::python3.13 not found on self-hosted macOS — install via the python.org pkg"
          exit 1

      - name: Set up Rust (host — needed on macOS / Windows)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel + twine
        run: python -m pip install --upgrade pip cibuildwheel==2.21.3 twine

      - name: Build wheels with cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse drevo-py
        # `drevo-py` is the package directory cibuildwheel points at
        # (`drevo-py/pyproject.toml`).

      - name: Validate wheel metadata (twine check)
        # `twine check dist/*` exits non-zero on a missing description,
        # invalid classifier, or unrenderable README. Catches metadata
        # mistakes before any future release task tries to upload.
        run: python -m twine check wheelhouse/*.whl

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: drevo-py-wheels-macos-self-hosted
          path: wheelhouse/*.whl
          retention-days: 14

  build_sdist:
    name: Build sdist
    # Self-hosted runner — sdist is a pure-Python tarball that does
    # not need a Linux-specific environment. Was previously
    # `ubuntu-latest`; corrected 2026-05-27 in the same change that
    # moved `build_wheels` to self-hosted.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate system Python 3.13 on self-hosted macOS
        # See the `build_wheels` job: `actions/setup-python@v5` tries to
        # `mkdir /Users/runner` on the self-hosted runner and fails. Shim
        # the python.org 3.13 binary onto `$GITHUB_PATH` instead.
        shell: bash
        run: |
          for candidate in \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13" \
            "$(command -v python3.13 || true)" \
            "/opt/homebrew/bin/python3.13" \
            "/usr/local/bin/python3.13"; do
            if [ -x "$candidate" ]; then
              echo "Using $candidate ($($candidate --version))"
              mkdir -p "$GITHUB_WORKSPACE/.py-shim"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python3"
              echo "$GITHUB_WORKSPACE/.py-shim" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::python3.13 not found on self-hosted macOS — install via the python.org pkg"
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist with maturin
        run: |
          python -m pip install --upgrade pip 'maturin>=1.7,<2.0' twine
          maturin sdist --manifest-path drevo-py/Cargo.toml --out wheelhouse

      - name: Validate sdist metadata
        run: python -m twine check wheelhouse/*.tar.gz

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: drevo-py-sdist
          path: wheelhouse/*.tar.gz
          retention-days: 14
