# Docs-only PR pass-through — pairs with `.github/workflows/ci.yml`.
#
# Purpose
# -------
# When a PR or push touches only documentation (`**/*.md`, `audit/**`,
# `memory/**`, `LICENSE`, `.gitignore`), the real CI workflow in
# `ci.yml` is suppressed via its `paths-ignore` filter — none of its
# jobs run. But GitHub branch protection requires the named status
# checks (`CI / Check`, `CI / Test`, `CI / Clippy`, …) to exist and
# pass before a PR can be merged. A workflow that never ran does NOT
# satisfy branch protection — required checks stay "Expected" forever,
# blocking the merge.
#
# This file emits successful status checks under the same coordinates
# (`workflow name: CI` + identical `name:` per job) so that docs-only
# PRs satisfy branch protection without spending CI minutes on a Rust
# build that has no Rust changes to test.
#
# Trigger inversion
# -----------------
# `ci.yml` uses `paths-ignore: [**/*.md, audit/**, memory/**, LICENSE,
# .gitignore]` — it runs when at least one changed path is NOT in that
# list. This file uses `paths: [**/*.md, audit/**, memory/**, LICENSE,
# .gitignore]` — it runs when at least one changed path IS in that
# list.
#
# Mixed PR (some Rust + some docs): GitHub evaluates `pull_request` path
# filters against the WHOLE PR diff, so any doc file anywhere in the PR
# makes this workflow trigger alongside ci.yml. Both emit the same
# `CI / <job>` contexts; GitHub keeps the latest report per context.
#
# KNOWN LIMITATION (do not "fix" with a fail-closed guard here): on the
# single self-hosted runner the two workflows' jobs interleave
# unpredictably, so neither is guaranteed to report last. A fail-closed
# skip job (tried 2026-06-30) therefore non-deterministically won a
# context and BLOCKED a PR whose real CI had passed. The real fix for the
# false-green is to collapse this into ci.yml as conditional jobs gated by
# a paths-filter (one workflow, one set of contexts) — tracked separately.
# Until then these stay trivial pass-throughs; the deps/-bloat guard in
# ci.yml (which stops the Test timeout that caused the observed
# false-green) is the load-bearing mitigation.
#
# How to keep this in sync with ci.yml
# ------------------------------------
# Every job in `ci.yml` must have a same-named (`name: <X>`) job in
# this file. If a new job is added to `ci.yml`, add it here too — the
# tests in `tests/ci_self_hosted_runner_tests.rs` will fail if the
# job-name sets diverge. The workflow-level `name: CI` must be
# identical in both files (line 1).

name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'audit/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'audit/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'

# Distinct concurrency group from ci.yml's. See ci.yml for the full
# rationale — using `${{ github.workflow }}` in the group key would
# collapse this workflow's queue into ci.yml's (both are
# `name: CI`), and on mixed PRs the skip workflow would race-cancel
# the real CI via `cancel-in-progress`. Hard-coding `ci-skip` here
# keeps the two queues independent. The invariant is tested in
# `tests/ci_self_hosted_runner_tests.rs`.
concurrency:
  group: ci-skip-${{ github.ref }}
  cancel-in-progress: true

# The jobs below mirror the `name:` field of every job in ci.yml. The
# job-id (the YAML key, e.g. `check`) must match too — GitHub uses
# `workflow / job_name` as the status-check coordinate, but matching
# the id keeps the two files visually aligned for review.
#
# Each job is a single `echo` step on the self-hosted runner. We
# explicitly DO NOT use ubuntu-latest here: the repo is private and
# GitHub-hosted minutes were exhausted by the earlier PR #76
# experiment. A self-hosted `echo` finishes in <1 second and
# satisfies branch protection equally well.
jobs:
  check:
    name: Check
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  k8s:
    name: K8s manifests
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  doc:
    name: Doc
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  msrv:
    name: MSRV
    runs-on: self-hosted
    steps:
      - run: echo "skipped — docs-only change"

  # The fuzz job intentionally has NO skip pass-through. It's
  # `continue-on-error: true` in ci.yml and is not (and must not be)
  # a required branch-protection check. If you ever do make it a
  # required check, mirror it here too.
