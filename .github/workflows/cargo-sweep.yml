# Weekly prune of stale Cargo build artifacts on the self-hosted runner.
#
# Why: `target/.../deps/` accumulates one set of hashed artifacts per build
# (old test binaries, .d, .rmeta) and is never cleaned by incremental builds.
# On this self-hosted macOS runner it had grown to ~900k files. macOS
# code-sign validation (syspolicyd) scans the WHOLE directory containing a
# binary on every exec (SecStaticCodeCreateWithPath -> bestGuess -> CFBundle
# -> readdir/__getdirentries64), so a ~900k-file deps/ made each test-binary
# launch take ~23s instead of ~0.2s, which hung the `Test` job to its 4h
# timeout. See KG incident_2026_06_21_ci_test_hang_security_stack.
#
# `cargo-sweep` removes artifacts not touched in the last N days while
# keeping the current build, so incremental builds stay fast and deps/ stays
# bounded. Scheduled for the Thursday->Friday night (Fri 00:00 UTC ~= 03:00
# Europe/Kyiv) when the runner is idle.
name: Cargo sweep

on:
  schedule:
    - cron: '0 0 * * 5' # Fri 00:00 UTC (night Thu->Fri local, EEST/EET)
  workflow_dispatch: {}

concurrency:
  group: cargo-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep stale build artifacts
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Install cargo-sweep (cached on the self-hosted runner)
        run: command -v cargo-sweep >/dev/null 2>&1 || cargo install cargo-sweep
      - name: Sweep all Cargo target dirs (keep artifacts used in last 7 days)
        run: |
          # The CI jobs use dedicated target dirs under the runner's _tool
          # cache (CARGO_TARGET_DIR=.../drevo-cargo-target-*). Sweep them all
          # recursively; --recursive auto-discovers every target dir below.
          tool="${RUNNER_TOOL_CACHE:-$HOME/actions-runner/_work/_tool}"
          echo "sweeping target dirs under: $tool"
          before=$(find "$tool" -type d -name deps 2>/dev/null -exec sh -c 'ls -1f "$1" | wc -l' _ {} \; | paste -sd+ - | bc 2>/dev/null || echo "?")
          echo "deps files before: ${before}"
          cargo sweep --recursive --time 7 "$tool" || true
          after=$(find "$tool" -type d -name deps 2>/dev/null -exec sh -c 'ls -1f "$1" | wc -l' _ {} \; | paste -sd+ - | bc 2>/dev/null || echo "?")
          echo "deps files after: ${after}"
