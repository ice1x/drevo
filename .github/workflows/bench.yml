# Nightly criterion benchmark workflow — scheduled, NEVER triggered
# by PR or push.
#
# Why this file exists
# --------------------
# drevo's four benchmark crates (`storage_bench`, `graph_bench`,
# `fts_bench`, `traversal_bench`) declare `harness = false` so each one
# runs criterion's `main()` even under `cargo test --benches`. Single
# iterations through the heavy cells are brutal:
#
#   bulk_put_100k/RedbBackend        ~530-720 s
#   scan_prefix/RedbBackend/1000     ~641 s
#   graph_insert_nodes_100k/Memory   ~122 s
#   traversal_bfs/outgoing/depth_2   ~245 s
#   …
#
# A full `cargo bench --all-features` at criterion's default sample size
# took ~150-175 min in practice (not the ~1h once assumed) — see the
# `--sample-size 20` + `timeout-minutes` in the job below, which bound it.
# Running benches on every PR was the root cause of the four-hour CI
# debacle on PR #76. PR #77 fixed PR-gating CI by removing benches
# from the `test` job. This file is the OTHER half: benches still
# matter as a perf signal, they just don't belong in the PR critical
# path.
#
# Triggers
# --------
#   * `schedule: cron '0 4 * * *'` — every day at 04:00 UTC. UTC, not
#     local: GitHub Actions cron is always UTC. Pick a time when the
#     self-hosted runner is otherwise idle. 04:00 UTC = 06:00 CET /
#     20:00 PST / 07:00 MSK; no overlap with typical PR activity.
#   * `workflow_dispatch:` — run on demand from the Actions UI. Use
#     this before/after touching perf-sensitive code (`src/fts/**`,
#     `src/storage/**`, `src/traversal.rs`) to spot regressions
#     before nightly.
#
# Notably absent: `push:` and `pull_request:`. Benches do NOT run on
# PRs. Locked by `tests/ci_self_hosted_runner_tests.rs`.
#
# Runner
# ------
# `self-hosted`. Benchmark numbers MUST come from a stable host —
# GitHub-hosted ubuntu-latest VMs are ephemeral with variable
# neighbour load, so timings would be noise-dominated. The Apple
# Silicon self-hosted runner already handles cargo-fuzz and Docker
# multi-arch; criterion stability is the third reason to keep it.
#
# Output
# ------
# Criterion writes HTML reports + raw timing JSON under
# `target/criterion/`. The workflow uploads that whole tree as an
# artifact named `criterion-<run_id>`, which lasts 90 days under
# GitHub's default retention. For long-term trend tracking, a future
# task (Phase 10.5 `00123`) can extend this workflow to commit the
# raw timings into a `bench-history/` folder or publish to
# GitHub Pages.

name: Bench

on:
  schedule:
    # 04:00 UTC daily. GitHub schedules can be late by 15-30 min
    # under load — that's acceptable; we're not racing anyone.
    - cron: '0 4 * * *'
  workflow_dispatch:

# A second cron firing while the previous nightly run is still in
# progress would queue indefinitely on the single self-hosted runner.
# Cancel the older run so the latest scheduled (or manually
# dispatched) bench wins. The group is workflow-specific and does
# NOT collide with ci.yml's `ci-real-${{ github.ref }}` or
# ci-skip.yml's `ci-skip-${{ github.ref }}`.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    # Hard cap so a scheduled bench can never squat the single
    # self-hosted runner for hours. Before this, a full run took
    # ~150-175 min every night (one run hit 359 min — one minute from
    # GitHub's 360-min default kill), monopolising the only runner from
    # 04:00 well into working hours. Combined with the reduced criterion
    # `--sample-size` below (which brings a normal run comfortably under
    # this cap), 90 min is generous headroom for the real work while
    # bounding any pathological hang. Mirrors `slow-tests.yml`.
    timeout-minutes: 90
    # Do NOT block the workflow on a single regressed bench — let
    # all four bench crates run, surface failures as annotations,
    # and capture the criterion HTML so a human can triage.
    continue-on-error: true
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Swatinem — job-level `CARGO_TARGET_DIR` above persists
      # target/ on local disk; the GHA-cache restore would replace
      # fresher local state with an older snapshot.

      - name: Run all criterion benches
        # `--all-features` so the bench crates compile against the
        # same feature surface the test suite uses. `--no-fail-fast`
        # so one failing bench doesn't prevent the rest from
        # producing data.
        #
        # `-- --sample-size 20` (criterion default is 100): this is a
        # nightly regression TRIPWIRE, not publication-grade measurement,
        # so 20 samples is plenty to catch a meaningful regression while
        # cutting wall-clock ~4-5x. Full-config runs took ~150-175 min and
        # hogged the single runner for hours; 20 samples brings that well
        # under the 90-min `timeout-minutes` cap above. Bump it (or run
        # `workflow_dispatch` with the default) when a run needs tighter
        # confidence intervals.
        run: cargo bench --all-features --no-fail-fast -- --sample-size 20

      - name: Upload criterion reports
        # Always upload — even on partial failure we want the
        # criterion HTML for the benches that did complete.
        #
        # The path MUST track `CARGO_TARGET_DIR` (set above to
        # `$RUNNER_TOOL_CACHE/drevo-cargo-target`), NOT the hard-coded
        # `target/`. criterion writes its reports to
        # `$CARGO_TARGET_DIR/criterion/`; the old `path: target/criterion/`
        # pointed at a directory that never exists under the redirected
        # target dir, so every run logged "No files were found … target/
        # criterion/" and uploaded an EMPTY artifact — the benchmark data
        # was generated but never published.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: ${{ env.CARGO_TARGET_DIR }}/criterion/
          retention-days: 90
          if-no-files-found: warn
