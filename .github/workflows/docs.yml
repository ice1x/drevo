# Build the mdBook documentation site from docs/ and deploy it to GitHub Pages.
#
# Pages Source is "GitHub Actions" — there is no gh-pages branch; the built
# book/ directory is uploaded as a Pages artifact and deployed directly. Runs
# only when the docs (or this pipeline) change on main, plus manual dispatch.
# Invariants are locked by tests/docs_site_tests.rs.
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight production deploy finish.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned release tarball: fast (~seconds) and reproducible, vs a
      # multi-minute `cargo install mdbook` toolchain build.
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
