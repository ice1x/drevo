# Lightweight Python CI gate for `drevo-py` — landed alongside
# Phase 16 task `00116` packaging.
#
# This workflow is the **fast-feedback** Python signal on every PR:
# one self-hosted job × Python 3.13 that runs `maturin develop`,
# then `pytest`, `mypy --strict`, `ruff check`, and `black --check`.
# Total runtime ≈ 1–2 minutes on the warm self-hosted runner (the
# persistent venv at `$RUNNER_TOOL_CACHE/drevo-py-venv-py313` plus
# the persistent `$CARGO_TARGET_DIR` mean `maturin develop` is
# usually an incremental relink).
#
# Runs on the same self-hosted macOS runner as `ci.yml` /
# `slow-tests.yml` / `bench.yml` — no GitHub-hosted minutes are
# billed. An earlier landing of this file mistakenly targeted
# `ubuntu-latest`; corrected 2026-05-27 alongside
# `python-wheels.yml`'s self-hosted move after a Phase 10 merge
# burst consumed ~2,700 of the account's 3,000 monthly Actions
# minutes in one cycle (see KG: `incident_2026_05_27_ci_minutes_burn`).
#
# Why this is NOT the full 00122 matrix yet:
#   * The matrix in roadmap task 00122 is 4 Python × 3 OS = 12 cells.
#     Today the only Python tests are the 40 shim cases in
#     `drevo-py/tests/test_shim.py`; running them across 12 cells
#     would burn CI minutes without proportional signal.
#   * The full matrix lights up when `00118` (unit ~80) + `00119`
#     (integration ~40) + `00120` (e2e 5 scenarios + RAG) ship —
#     ~125 more tests with meaningful per-OS / per-Python divergence
#     (FTS UTF-8 boundaries, redb file locking, GIL re-acquisition).
#   * `python-wheels.yml` (cibuildwheel) already exercises the shim
#     contract on every wheel before upload, so a Windows-specific
#     regression in the shim itself is caught there too — just
#     slower. This workflow gives the fast signal; cibuildwheel
#     gives the cross-platform proof.
#
# Path filters: triggered only by changes that can plausibly affect
# the Python surface. A doc-only PR or a change isolated to
# `src/ffi.rs` doesn't need to re-run this workflow.

name: Python CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same PR /
# branch — same pattern as ci.yml / python-wheels.yml. Distinct group
# key so the three workflows do not collide.
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    name: Lint + test (Python 3.13)
    # `self-hosted`, matching every other workflow in this repo. The
    # 2026-05-25 self-hosted-runner revert (memory:
    # `project_state_2026_05_25`) missed this file and python-wheels.yml;
    # both burned ~2,700 of the 3,000 monthly Actions minutes during the
    # Phase 10 Cypher merge burst before being corrected on 2026-05-27.
    runs-on: ubuntu-latest
    steps:
      - name: Configure the Python venv path
        # A fresh, workspace-local venv each run. (The self-hosted version
        # kept a persistent venv + CARGO_TARGET_DIR under $RUNNER_TOOL_CACHE;
        # on ephemeral GitHub-hosted runners we use a normal venv + let cargo
        # write ./target so Swatinem/rust-cache below can cache it.)
        run: echo "DREVO_PY_VENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        # actions/setup-python installs a clean CPython 3.13 on the
        # GitHub-hosted runner. (The old self-hosted step searched macOS
        # system paths and fails on ubuntu.) Pinned to 3.13 because
        # `[tool.black].target-version` in `drevo-py/pyproject.toml`
        # includes `py313` — black's AST safety check fails on an older
        # interpreter. The abi3-py310 wheel tag still supports 3.10+, so
        # only the CI lint/test Python moves up.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Record the Python interpreter
        run: echo "DREVO_PY_BIN=$(command -v python3.13 || command -v python)" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (drevo + pyo3 + redb)
        # On GitHub-hosted runners the target dir is ephemeral, so a
        # download-restored cache is what keeps `maturin develop` fast.
        uses: Swatinem/rust-cache@v2

      - name: Ensure persistent venv at $DREVO_PY_VENV (create on first run)
        # The previous form `python -m venv .venv` recreated a fresh
        # venv inside the repo every run — every pip install paid the
        # cold-cache cost. Moving the venv to
        # `$RUNNER_TOOL_CACHE/drevo-py-venv-py313` makes it survive
        # between runs; subsequent runs only verify that the venv
        # exists and surface its PATH / VIRTUAL_ENV. Re-creation is
        # automatic if a future Python upgrade renames the tool-cache
        # path or if an operator wipes the runner's tool cache.
        #
        # Uses `$DREVO_PY_BIN` (exported by the previous step) so the
        # venv binds to the same interpreter that was located on the
        # runner — not whatever happens to be on PATH.
        run: |
          if [ ! -x "$DREVO_PY_VENV/bin/python" ]; then
            "$DREVO_PY_BIN" -m venv "$DREVO_PY_VENV"
          fi
          echo "VIRTUAL_ENV=$DREVO_PY_VENV" >> "$GITHUB_ENV"
          echo "$DREVO_PY_VENV/bin" >> "$GITHUB_PATH"

      - name: Install / upgrade Python tooling (no-op when up to date)
        # pip checks installed package metadata and skips packages that
        # already satisfy the requested version specifier, so on a warm
        # cache this step takes a couple of seconds. The pin on maturin
        # matches drevo-py/pyproject.toml [build-system].requires so
        # the local + CI build paths stay in lockstep.
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.7,<2.0" pytest mypy ruff black faker hypothesis

      - name: maturin develop --release (build + install drevo-py)
        run: |
          # `develop` compiles the cdylib + installs the wheel into
          # the active venv in editable mode, mirroring what
          # contributors run locally. `--release` matches the wheel
          # configuration cibuildwheel uses, so any -O / -strip
          # interaction surfaces here too. We compile via the
          # workspace's `redb-backend` feature (the wheel's default)
          # to keep parity with the runtime contract in test_shim.py.
          cd drevo-py
          maturin develop --release

      - name: pytest (drevo-py/tests — 40 shim runtime tests)
        # The shim suite at drevo-py/tests/test_shim.py exercises
        # UUID wrapping, InvalidWeightError subclass, __all__
        # consistency, RFC §3.3 method enumeration, context-manager
        # close, etc. Roughly 40 tests, sub-second runtime.
        run: |
          cd drevo-py
          pytest -q

      - name: mypy --strict (python/drevo/ + .pyi stubs)
        # The .pyi stubs (drevo-py/python/drevo/__init__.pyi) are
        # hand-authored and shipped in every wheel. `mypy --strict`
        # asserts (a) the stubs themselves type-check, (b) the
        # pure-Python `__init__.py` shim type-checks against them.
        # Locks the contract that user code with `mypy --strict
        # drevo/` sees no Any leaks.
        run: |
          cd drevo-py
          mypy --strict python/drevo/

      - name: ruff check (python/drevo/ + tests/)
        # Style + unused-import + bug-class lints. Pinned ruleset
        # via drevo-py/pyproject.toml [tool.ruff] so adding a rule
        # is a deliberate PR decision, not a CI surprise.
        run: |
          cd drevo-py
          ruff check python/ tests/

      - name: black --check (python/drevo/ + tests/)
        # Formatting gate. Matches the black config in
        # drevo-py/pyproject.toml [tool.black] (line-length 100,
        # target-version py310-py313).
        run: |
          cd drevo-py
          black --check python/ tests/
