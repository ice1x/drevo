# Lightweight Python CI gate for `drevo-py` — landed alongside
# Phase 16 task `00116` packaging.
#
# This workflow is the **fast-feedback** Python signal on every PR:
# one self-hosted job × Python 3.12 that runs `maturin develop`,
# then `pytest`, `mypy --strict`, `ruff check`, and `black --check`.
# Total runtime ≈ 3–5 minutes — about a third of what cibuildwheel
# (`python-wheels.yml`) takes, and small enough to gate every PR
# without queueing. Runs on the same self-hosted macOS runner as
# `ci.yml` / `slow-tests.yml` — no GitHub-hosted minutes are billed
# (an earlier landing of this file mistakenly targeted ubuntu-latest;
# corrected 2026-05-27 alongside `python-wheels.yml`'s push-trigger
# removal after a Phase 10 merge burst consumed ~2,700 of the
# account's 3,000 monthly Actions minutes in one cycle).
#
# Why this is NOT the full 00122 matrix yet:
#   * The matrix in roadmap task 00122 is 4 Python × 3 OS = 12 cells.
#     Today the only Python tests are the 40 shim cases in
#     `drevo-py/tests/test_shim.py`; running them across 12 cells
#     would burn CI minutes without proportional signal.
#   * The full matrix lights up when `00118` (unit ~80) + `00119`
#     (integration ~40) + `00120` (e2e 5 scenarios + RAG) ship —
#     ~125 more tests with meaningful per-OS / per-Python divergence
#     (FTS UTF-8 boundaries, redb file locking, GIL re-acquisition).
#   * `python-wheels.yml` (cibuildwheel) already exercises the shim
#     contract on every wheel before upload, so a Windows-specific
#     regression in the shim itself is caught there too — just
#     slower. This workflow gives the fast signal; cibuildwheel
#     gives the cross-platform proof.
#
# Path filters: triggered only by changes that can plausibly affect
# the Python surface. A doc-only PR or a change isolated to
# `src/ffi.rs` doesn't need to re-run this workflow.

name: Python CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same PR /
# branch — same pattern as ci.yml / python-wheels.yml. Distinct group
# key so the three workflows do not collide.
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    name: Lint + test (Python 3.12)
    # `self-hosted`, matching every other workflow in this repo. The
    # original landing of this file used `ubuntu-latest` for the
    # initial 00116 shim run; the self-hosted reversal on 2026-05-25
    # (see `project_state_2026_05_25` in memory + the
    # `ci_self_hosted_runner_*` tasks in the KG) missed this file and
    # the wheels workflow, so every Python CI run was still billing
    # GitHub-hosted ubuntu minutes for a workflow whose target-dir
    # wiring (`$RUNNER_TOOL_CACHE/drevo-cargo-target` below) is
    # specifically designed for a persistent self-hosted state. With
    # this change, every step here uses local laptop resources only,
    # matching the rest of `ci.yml` / `slow-tests.yml` / etc.
    runs-on: self-hosted
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads keyed off pyproject.toml so a no-op PR
          # re-uses the previous install. Speeds up the cold path by
          # ~30s.
          cache: "pip"
          cache-dependency-path: drevo-py/pyproject.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No `Swatinem/rust-cache@v2` here. The setup step above
      # exported `CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target`
      # into `$GITHUB_ENV`, pointing cargo at a persistent location.
      # `maturin develop` honours that env var, so its compiled drevo
      # + pyo3 + redb artefacts land in the same shared directory the
      # rest of the CI uses and stay warm across runs. Layering
      # Swatinem on top would download an older snapshot over HTTPS
      # and overwrite the live state.

      - name: Create + activate venv (maturin develop requires one)
        # `actions/setup-python` exposes the interpreter on PATH but
        # does NOT create or activate a virtualenv. `maturin develop`
        # refuses to install the cdylib without a venv (it does not
        # want to touch the system / hosted-tool-cache site-packages,
        # which would leak between CI runs). Solution: create a venv
        # here and surface `VIRTUAL_ENV` + the venv's `bin/` on PATH
        # through `$GITHUB_ENV` / `$GITHUB_PATH` so every subsequent
        # step (each a fresh shell) sees the same environment.
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python build + lint tooling
        run: |
          python -m pip install --upgrade pip
          # Pinned to the same maturin range declared in
          # drevo-py/pyproject.toml [build-system].requires so the
          # local + CI build paths stay in lockstep.
          pip install "maturin>=1.7,<2.0" pytest mypy ruff black

      - name: maturin develop --release (build + install drevo-py)
        run: |
          # `develop` compiles the cdylib + installs the wheel into
          # the active venv in editable mode, mirroring what
          # contributors run locally. `--release` matches the wheel
          # configuration cibuildwheel uses, so any -O / -strip
          # interaction surfaces here too. We compile via the
          # workspace's `redb-backend` feature (the wheel's default)
          # to keep parity with the runtime contract in test_shim.py.
          cd drevo-py
          maturin develop --release

      - name: pytest (drevo-py/tests — 40 shim runtime tests)
        # The shim suite at drevo-py/tests/test_shim.py exercises
        # UUID wrapping, InvalidWeightError subclass, __all__
        # consistency, RFC §3.3 method enumeration, context-manager
        # close, etc. Roughly 40 tests, sub-second runtime.
        run: |
          cd drevo-py
          pytest -q

      - name: mypy --strict (python/drevo/ + .pyi stubs)
        # The .pyi stubs (drevo-py/python/drevo/__init__.pyi) are
        # hand-authored and shipped in every wheel. `mypy --strict`
        # asserts (a) the stubs themselves type-check, (b) the
        # pure-Python `__init__.py` shim type-checks against them.
        # Locks the contract that user code with `mypy --strict
        # drevo/` sees no Any leaks.
        run: |
          cd drevo-py
          mypy --strict python/drevo/

      - name: ruff check (python/drevo/ + tests/)
        # Style + unused-import + bug-class lints. Pinned ruleset
        # via drevo-py/pyproject.toml [tool.ruff] so adding a rule
        # is a deliberate PR decision, not a CI surprise.
        run: |
          cd drevo-py
          ruff check python/ tests/

      - name: black --check (python/drevo/ + tests/)
        # Formatting gate. Matches the black config in
        # drevo-py/pyproject.toml [tool.black] (line-length 100,
        # target-version py310-py313).
        run: |
          cd drevo-py
          black --check python/ tests/
