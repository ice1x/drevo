name: CI

# Single source of truth for the required PR status checks.
#
# Docs-only handling: the `changes` job below detects whether the push /
# PR touches anything beyond docs (**/*.md, audit/**, memory/**, LICENSE,
# .gitignore). Every gated job runs its real work UNLESS the change is
# docs-only, in which case the job is skipped — and a skipped required
# check counts as success for branch protection, so a docs-only PR merges
# without a Rust build.
#
# Why not the old `paths-ignore` + paired `ci-skip.yml`: that two-workflow
# design (both `name: CI`) had each workflow emit the same `CI / <Job>`
# contexts. On the single self-hosted runner their jobs interleaved, so
# whichever reported last won the context — the skip workflow's trivial
# green could mask a failed/cancelled real run (regression 2026-06-29:
# real Test timed out, PR still showed green), and a fail-closed variant
# instead non-deterministically BLOCKED a passing PR (2026-06-30). One
# workflow owning each context removes the race. Consequently this
# workflow triggers on ALL pushes/PRs to main (NO paths-ignore): the
# filtering is per-job (skip→success), not per-workflow (which would
# leave required checks "Expected" forever and is exactly why ci-skip.yml
# had to exist).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a newer commit lands on the same PR /
# branch. Without this, every rapid-fire push stacks into the self-hosted
# runner queue and a PR ends up waiting on stale runs for its own
# previous commits — root cause of the multi-hour CI latency seen on
# PRs #75 and #76. The grouping key includes the workflow name so other
# workflows (Docker Publish, Cross-compile) keep their own queues.
# The group key is hard-coded `ci-real` (not `${{ github.workflow }}`)
# for historical reasons — when ci-skip.yml still existed both files were
# `name: CI`, so `github.workflow` collapsed their queues. ci-skip.yml is
# gone now, but a literal key is still the clearest contract. The
# invariant is tested in `tests/ci_self_hosted_runner_tests.rs`.
concurrency:
  group: ci-real-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # nextest needs no specific env; documented here to make the contract
  # explicit for future contributors who might wonder.
  CARGO_INCREMENTAL: 1
  # Cap parallel compilation on the self-hosted runner, which is also a
  # daily-driver Mac (10 logical cores). At the default `jobs = num-cpus`,
  # a full workspace `cargo build` spawns up to 10 parallel rustc/codegen
  # processes; combined with the runner's own work, the parallel test run,
  # and interactive desktop use, that has wedged the whole machine into an
  # unresponsive, beach-balling freeze (power-cycle required). Capping to 8
  # leaves 2 cores' worth of headroom for the OS / UI during a build while
  # barely slowing compilation. Test-process parallelism is capped
  # separately in `.config/nextest.toml` (`test-threads`). Both caps are
  # locked by `tests/ci_self_hosted_runner_tests.rs` so a future edit can't
  # silently revert them.
  CARGO_BUILD_JOBS: "8"
  # NOTE: `CARGO_TARGET_DIR` is set by a setup step inside each
  # compile-heavy job below — `echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE
  # /drevo-cargo-target" >> $GITHUB_ENV`. GHA's `runner.*` expression
  # context is ONLY available at step level — putting `${{ runner.tool_cache }}`
  # in either workflow-level `env:` OR job-level `env:` makes GitHub
  # reject the whole workflow with a generic "workflow file issue"
  # error (run shows under the file path instead of `name: CI`, no
  # jobs run, no logs). The first revision of this caching change
  # made the workflow-level mistake; commit 0872954 moved it to
  # job-level (still wrong — `runner.*` is unavailable there too);
  # this revision moves it into a setup step that reads the always-
  # set `$RUNNER_TOOL_CACHE` shell env var. Locked by
  # `tests/ci_self_hosted_runner_tests.rs::ci_workflows_dont_use_runner_context_outside_steps`.

jobs:
  # All jobs run on `self-hosted`. The repo is private; GitHub Free
  # gives 2000 GitHub-hosted minutes / month for private repos, and
  # the prior ubuntu-latest experiment (PR #76 → reverted in this
  # workflow) blew through that quota in a single afternoon and
  # left the repo unable to dispatch any GitHub-hosted job (UI saw
  # "fail after 2s" with no step logs — runners simply never came
  # online). The self-hosted Apple Silicon runner has no such cap.
  #
  # The original speed problem that motivated PR #76 was NOT the
  # runner — it was criterion benchmarks running inside the `test`
  # job (`bulk_put_100k/RedbBackend` ≈ 530s and friends). PR #77
  # removed those by dropping `--all-targets` from the nextest
  # invocation; on self-hosted with that fix in place the `test`
  # job finishes in ~5-10 minutes, well within an acceptable PR
  # latency envelope. Three other PR #76 wins — `concurrency:
  # cancel-in-progress`, `cargo nextest`, and the docs-only
  # `paths-ignore` + paired `ci-skip.yml` — are kept, since none
  # of them depended on the runner choice.

  # Docs-only detector. Output `code` is 'false' ONLY when every changed
  # file matches the docs globs (**/*.md, audit/**, memory/**, LICENSE,
  # .gitignore); otherwise 'true'. Every gated job below runs unless
  # `code == 'false'`, so any detection failure or unresolvable range
  # FAILS SAFE toward running the full suite (never toward a silent skip).
  # This job is NOT a required branch-protection check — only the build
  # jobs are. Replaces the deleted ci-skip.yml: one workflow now owns
  # each `CI / <Job>` context, so no dual-workflow status race.
  changes:
    name: changes
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"; head="${HEAD_SHA:-}"
          # Fail safe: unresolvable range (e.g. a new-branch push whose
          # `before` is all-zeros) → run the full suite.
          if [ -z "$base" ] || [ -z "$head" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            echo "cannot resolve range ($base..$head) — running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files ($base..$head):"; echo "$changed"
          nondoc="$(printf '%s\n' "$changed" \
            | grep -vE '(\.md$|^audit/|^memory/|^LICENSE$|^\.gitignore$)' \
            | grep -v '^$' || true)"
          if [ -n "$nondoc" ]; then
            echo "non-docs files present → full CI:"; echo "$nondoc"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change → build jobs will skip (skip == success for required checks)"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: changes
    # Run unless the change is provably docs-only. `always()` keeps this
    # fail-safe even if `changes` errored (empty output != 'false' → runs).
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # timeout-minutes (added 2026-06-10): GitHub's default job timeout is
    # 360 minutes. On the single self-hosted runner, two concurrent CI
    # runs' jobs share one `$CARGO_TARGET_DIR`, so a job can block on the
    # cargo build-dir file lock held by a sibling job. Without an explicit
    # cap such a job squats the runner for the full 6 hours before being
    # killed (incident: PR #145's duplicate run — the `test` job hung at
    # "Compiling drevo" for exactly 360m, starving every other PR). Each
    # job now caps well above its observed legitimate runtime (Test/Clippy
    # reach ~90min on this contended runner) but far below 360, so a
    # lock-blocked or hung job fails fast and frees the runner instead of
    # holding it for 6h. Locked by
    # `tests/ci_self_hosted_runner_tests.rs::every_ci_job_declares_a_timeout`.
    timeout-minutes: 90
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets

  test:
    name: Test
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job for the rationale. MEASURED ROOT CAUSE: the
    # *test execution* is fast — all 2857 tests run in ~18 min
    # (`nextest` reported `1069s`). The multi-hour `Test` step was almost
    # entirely COMPILATION: every run cold-rebuilt the 104 test binaries
    # because all ci.yml jobs shared one `$CARGO_TARGET_DIR` and compile
    # in mutually-incompatible modes (cargo check vs clippy-driver vs
    # rustdoc vs the MSRV toolchain), so each job invalidated the next
    # job's cache. The per-job `-${{ github.job }}` target dir above fixes
    # that: `Test` now keeps its own warm cache across runs, so after a
    # one-time cold warm-up a typical PR only does an incremental
    # build + the ~18-min run (~30-60 min total). 240 is sized to let
    # that ONE cold warm-up complete (cold compile + run) and populate the
    # isolated cache; it still caps a true hang well under the 6h default.
    timeout-minutes: 240
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # nextest runs the integration + unit test suite ~2-3x faster than
      # `cargo test` because it parallelises across binaries (each
      # tests/*.rs is its own binary) rather than just within one. With
      # ~1700 tests across 25+ test binaries this matters.
      #
      # Targets NOT included in this run:
      #   * benches — `[[bench]]` crates with `harness = false` execute
      #     their criterion `main()` even under `cargo test --benches`
      #     (or nextest's `--all-targets`), and on the heavy benches
      #     (`bulk_put_100k/RedbBackend` ≈ 530s; `traversal_bfs/...` ≈
      #     240s each) a single iteration is enough to push a PR run
      #     past one hour. CI is for correctness, NOT for measuring
      #     performance. Bench timings belong in a separate scheduled
      #     workflow (see Phase 10.5 task 00123) or in a developer's
      #     `cargo bench` run, not in PR-gating CI.
      #   * doctests — nextest does not execute them; they are exercised
      #     by the explicit `cargo test --doc` step below.
      # That leaves: library unit tests (`src/**/*.rs`) + integration
      # tests (`tests/*.rs`), which is exactly what we want gated on
      # every PR.
      #
      # The invariant "this step MUST NOT pass `--all-targets`" is
      # locked by `tests/ci_self_hosted_runner_tests.rs::ci_yml_test_job_does_not_run_benches`.
      # Install cargo-nextest, cached on the self-hosted runner.
      # `taiki-e/install-action@v2` was observed taking ~24 min on a
      # contended run (it re-resolves / re-verifies every invocation),
      # which dominated the `Test` job's wall-clock. The self-hosted
      # runner persists `$HOME/.cargo/bin` between runs, so a `command -v`
      # guard around the official `get.nexte.st` tarball makes every run
      # after the first a sub-second no-op — same pattern the `fuzz` job
      # already uses for `cargo-fuzz`. The download URL is selected by
      # `$RUNNER_OS` so a future Linux self-hosted runner keeps working.
      - name: Install cargo-nextest (cached on self-hosted runner)
        run: |
          if command -v cargo-nextest >/dev/null 2>&1; then
            echo "cargo-nextest already installed: $(cargo-nextest --version)"
          else
            url="https://get.nexte.st/latest/mac"
            [ "$RUNNER_OS" = "Linux" ] && url="https://get.nexte.st/latest/linux"
            curl -LsSf "$url" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
            echo "installed cargo-nextest: $(cargo-nextest --version)"
          fi
      # Task `00129` re-enabled the slow integration-test binaries on the PR
      # path: the temporary `ci-fast` nextest profile (and `.config/nextest.toml`)
      # is gone, so this default-profile run exercises every test binary —
      # the proptest fixtures, the `*_bench_tests`, and `wal_crash_recovery_tests`
      # all gate every PR again. The only cells kept off the PR path are the
      # two heaviest redb-churn compaction tests, now marked `#[ignore]`
      # (`redb_backend_size_bytes_returns_file_size`, the 5 000-write file-growth
      # probe, and `redb_compact_reclaims_after_heavy_churn`); they run on
      # `slow-tests.yml` via `--run-ignored all`. nextest does not run
      # `#[ignore]`d tests by default, so no profile flag is needed here.
      # NOTE (2026-06-21): switched from `cargo nextest run` to sequential
      # `cargo test` on this self-hosted macOS runner. nextest's list phase
      # execs every test binary (~122 × 2 `--list` invocations) near-
      # simultaneously; that burst of first-execs of freshly-built binaries
      # overwhelms the macOS security stack (syspolicyd + XProtect on-exec
      # scan), wedging processes pre-main with no output until the 4h job
      # timeout. `--test-threads` only caps the run phase, not the list phase,
      # so it does not help. `cargo test` launches one binary at a time (no
      # burst) and completes reliably. `--tests` keeps doctests/benches out
      # (doctests run in the dedicated step below). See KG incident
      # incident_2026_06_21_ci_test_hang_security_stack.
      # Guard (2026-06-21, hardened 2026-06-30): the per-job target dir
      # accumulates hashed build artifacts forever; at ~900k+ files in deps/,
      # macOS code-sign validation (which readdir's the whole dir per binary
      # exec) makes each test launch ~23s and hangs this job until the 4h
      # timeout. Regression on 2026-06-29: deps/ had 1.09M files / 17GB and
      # Test timed out; the old guard called `cargo sweep --time 3`, which only
      # removes artifacts untouched for 3 days — on a constantly-rebuilding CI
      # almost everything is "fresh", so the sweep pruned ~nothing and the
      # thrash returned. The weekly cargo-sweep.yml has the same blind spot.
      # Fix: when deps/ crosses the threshold, do a HARD `cargo clean` — it
      # resets the dir to zero so the next build is cold (~10-20min, bounded)
      # instead of thrashing for 4h. A periodic cold rebuild is the cheap price
      # for never re-entering the signature-check death spiral.
      - name: Guard against deps/ bloat
        run: |
          deps="${CARGO_TARGET_DIR:-target}/debug/deps"
          n=0; [ -d "$deps" ] && n=$(ls -1f "$deps" 2>/dev/null | wc -l | tr -d ' ')
          echo "deps file count: $n"
          if [ "$n" -gt 100000 ]; then
            echo "deps/ over 100k files ($n) → cargo clean to stop macOS code-sign readdir thrash (one cold rebuild follows)"
            cargo clean
            echo "deps after clean: $(ls -1f "$deps" 2>/dev/null | wc -l | tr -d ' ')"
          fi
      - name: Run unit + integration tests (cargo test, sequential)
        run: cargo test --tests --no-fail-fast
      # Phase 11 task `00073` — Bolt-over-TLS lives behind the
      # `bolt-tls` Cargo feature, which is NOT in the default set
      # (rustls + tokio-rustls + rustls-pemfile add ~10 transitive
      # crates that unrelated CI gates have no reason to compile).
      # Re-run nextest with `--features bolt-tls` over the gated
      # binary + the inline unit tests so every push exercises the
      # encrypted path. Targeting only the TLS test surfaces keeps
      # the incremental cost to one rustls compile + ~3 short loopback
      # tests; the rest of the suite is already covered by the
      # full-suite step above.
      - name: Run bolt-tls feature tests (nextest)
        run: cargo nextest run --no-fail-fast --features bolt-tls -E 'binary(bolt_tls_tests) | (kind(lib) & test(bolt::tls))'
      # Phase 11 task `00074` — Bolt authentication. The argon2-backed
      # `UserStore` lives behind the `bolt-auth` Cargo feature (NOT in
      # the default set), so re-run nextest with the feature on over the
      # gated binary + inline unit tests. The dependency-free session
      # auth tests in `bolt_session_tests` are already covered by the
      # full-suite step above; this step adds the argon2 path.
      - name: Run bolt-auth feature tests (nextest)
        run: cargo nextest run --no-fail-fast --features bolt-auth -E 'binary(bolt_auth_tests) | (kind(lib) & test(bolt::auth))'
      - name: Run doctests
        run: cargo test --doc --all-features

  clippy:
    name: Clippy
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job rationale. Clippy compiles three feature sets
    # (default + bolt-tls + bolt-auth) and has reached ~86min under
    # contention; 120 leaves margin below the 360 default.
    timeout-minutes: 120
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      # Phase 11 task `00073` — guard the `bolt-tls`-gated code paths
      # against clippy regressions. Default-feature clippy doesn't see
      # `src/bolt/tls.rs` or `tests/bolt_tls_tests.rs`, so a second
      # invocation with the feature enabled is the only way to catch
      # warnings in those files before merge.
      - run: cargo clippy --all-targets --features bolt-tls -- -D warnings
      # Phase 11 task `00074` — guard the `bolt-auth`-gated code paths
      # (`src/bolt/auth.rs` UserStore + `tests/bolt_auth_tests.rs`)
      # against clippy regressions the default-feature pass can't see.
      - run: cargo clippy --all-targets --features bolt-auth -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job rationale. `cargo fmt --check` does no compile;
    # 20 min is generous slack over its few-second real runtime.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Phase 8 task 00049 — Kubernetes manifests under `k8s/`.
  # Phase 8 task 00050 — Kustomize overlays under `k8s/overlays/<env>/`.
  #
  # Three checks, all server-less (no live cluster, no kubeconfig):
  #   1. `kubectl kustomize k8s/` resolves the top-level wrapper, which
  #      forwards to `k8s/base/`.
  #   2. `kubectl kustomize k8s/base/` resolves the base directly.
  #   3. `kubectl kustomize k8s/overlays/<env>/` resolves each per-env
  #      overlay — catches a renamed base manifest, a broken `../../base/`
  #      reference, an unresolved patch target, or a kustomize-syntax
  #      slip in any overlay before it reaches a real cluster.
  #
  # The text-level `k8s_manifests_tests.rs` + `k8s_overlays_tests.rs`
  # suites already run in the `test` job above; this job adds the
  # structural pass that text matching cannot do (object graph
  # resolution, patch target verification).
  #
  k8s:
    name: K8s manifests
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job rationale. Pure `kubectl kustomize` resolution,
    # no compile; 20 min is ample.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: kubectl kustomize k8s/ (wrapper + base + overlays)
        run: |
          kubectl version --client=true
          for target in k8s/ k8s/base/ k8s/overlays/dev/ k8s/overlays/prod/; do
            echo "::group::kubectl kustomize $target"
            kubectl kustomize "$target" > "/tmp/$(basename "$target").yaml"
            # Fail the job if kustomize printed any warning/error to stderr.
            if kubectl kustomize "$target" 2>&1 1>/dev/null | grep -i 'warning\|error'; then
              echo "kubectl kustomize $target emitted warnings/errors above — fix before merge" >&2
              exit 1
            fi
            wc -l "/tmp/$(basename "$target").yaml"
            echo "::endgroup::"
          done

  # Phase 9 task 00060 — rustdoc for all public APIs.
  #
  # Runs `cargo doc --no-deps --all-features` under
  # `RUSTDOCFLAGS=-D warnings` so a missing rustdoc on any new `pub`
  # item OR a broken intra-doc link fails the build. `src/lib.rs`
  # carries `#![warn(missing_docs)]`; without the `-D warnings` env
  # var the warning would print and the build would still pass.
  doc:
    name: Doc
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job rationale.
    timeout-minutes: 75
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

  # Audit task 00113 — MSRV is declared in `Cargo.toml` (`rust-version`)
  # and locked in by `tests/crosscut_audit_tests.rs::cargo_toml_declares_rust_version`.
  # This job exercises that exact toolchain so the field cannot decay.
  msrv:
    name: MSRV
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # See the `check` job rationale. Two `cargo check`s (native +
    # wasm32) on the MSRV toolchain.
    timeout-minutes: 90
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          v=$(awk -F'"' '/^rust-version/ {print $2}' Cargo.toml)
          if [ -z "$v" ]; then
            echo "Cargo.toml is missing rust-version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - run: cargo check --all-features
      - run: cargo check --no-default-features --features wasm --target wasm32-unknown-unknown
        # The wasm sanity check is the cheapest way to catch a future MSRV
        # bump on `getrandom/wasm_js` (audit 00111 / 00113 cross-link).

  # Phase 9 task 00058 — coverage-guided fuzz smoke run for the FTS
  # tokenizer. cargo-fuzz needs nightly Rust + libFuzzer; the job is
  # therefore split out from the main matrix (stable Rust is enough for
  # everything else) and time-boxed to ~60 seconds per target so it
  # stays under the free CI budget. The stable-CI replay of the seed
  # corpus is already run by the `test` job above through
  # `tests/fts_tokenizer_fuzz_harness_tests.rs` — this job extends that
  # coverage with libFuzzer's branch-feedback mutator on every push.
  #
  # Stays on self-hosted because (a) cargo-fuzz needs libFuzzer +
  # AddressSanitizer + nightly Rust, the prebuilt path is best-tested
  # on a stable, named runner; (b) the 60s smoke run × 3 targets +
  # cargo-fuzz install can cumulate to ~5 minutes — keeping it off the
  # GitHub-hosted shared pool is friendlier to budget.
  fuzz:
    name: Fuzz
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: self-hosted
    # Don't block merges if cargo-fuzz finds a crash — surface it as a
    # CI annotation and let humans triage. The stable harness replay in
    # the `test` job remains a hard gate.
    continue-on-error: true
    # See the `check` job rationale. cargo-fuzz install + 3×60s smoke
    # targets; 45 min covers a cold from-source cargo-fuzz build on macOS.
    timeout-minutes: 45
    steps:
      - name: Set CARGO_TARGET_DIR (persistent target dir on self-hosted runner)
        # `runner.tool_cache` expression is ONLY available at step level —
        # putting it at workflow or job-level `env:` makes GHA reject the
        # YAML with a generic "workflow file issue" error (no jobs run,
        # no logs). The earlier fix-attempt in commit 0872954 moved this
        # from workflow-level env to job-level env, but GHA's context
        # availability rules forbid `runner.*` in *either* — only steps
        # can resolve it. Reading the shell env var $RUNNER_TOOL_CACHE
        # inside a `run:` (which IS step-level) is the working pattern.
        # Locked by ci_self_hosted_runner_tests.rs.
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/drevo-cargo-target-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # No Swatinem — job-level `CARGO_TARGET_DIR` above persists
      # target/ on local disk. `$HOME/.cargo/registry` and
      # `$HOME/.cargo/bin/cargo-fuzz` also persist naturally on
      # self-hosted, so a previously-installed cargo-fuzz binary is
      # already in `$PATH` on subsequent runs (the install step below
      # short-circuits when the binary is present).
      # cargo-fuzz binary install + target resolution:
      #
      # cargo-fuzz hard-codes a default --target that does not match
      # the host on either of our self-hosted platforms:
      #   - On Apple Silicon macOS it defaults to `x86_64-apple-darwin`
      #     (Intel) — the aarch64 host has no x86_64-apple-darwin rust
      #     std, so the build dies with E0463 "can't find crate for
      #     `core`". Override to `aarch64-apple-darwin`.
      #   - On Linux the cargo-fuzz binary we install is itself the
      #     taiki-e prebuilt for `x86_64-unknown-linux-musl`
      #     (statically-linked, portable). AddressSanitizer rejects
      #     statically-linked libc with "sanitizer is incompatible
      #     with statically linked libc", so we override to
      #     `x86_64-unknown-linux-gnu` (preinstalled on every Linux
      #     self-hosted runner via `rustup target add`).
      #
      # Both overrides are derived once at workflow load and exported
      # via $GITHUB_ENV so the per-target steps stay symmetric.
      - name: Install cargo-fuzz (Linux prebuilt — skip if cached)
        if: runner.os == 'Linux'
        # The taiki-e action is itself idempotent (it short-circuits
        # if the requested version is already installed in
        # $RUNNER_TOOL_CACHE), so on self-hosted the second run is a
        # near-no-op.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install cargo-fuzz (macOS — from source, skip if cached)
        # taiki-e ships no prebuilt aarch64-apple-darwin binary, so
        # build from source on nightly. ~2 min cold. On the
        # self-hosted runner `$HOME/.cargo/bin/cargo-fuzz` survives
        # between runs, so the explicit `command -v` guard turns
        # every subsequent run into an instant no-op (under a second)
        # without re-fetching the registry index or re-checking
        # `cargo install`'s version freshness logic. To force a
        # rebuild (e.g. after a nightly-Rust ABI bump), delete the
        # binary on the runner and re-trigger the workflow.
        if: runner.os == 'macOS'
        run: |
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already installed at $(command -v cargo-fuzz) — skipping cargo install"
          else
            echo "cargo-fuzz not found in PATH — building from source"
            cargo install cargo-fuzz --locked
          fi

      - name: Resolve fuzz --target for host
        id: fuzz_target
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              echo "target=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              # Derive the target from the NIGHTLY toolchain's own host
              # triple, NOT `uname -m`. The GitHub runner may pick an
              # x86_64 Homebrew bash (`/usr/local/bin/bash`) for `run:`
              # steps; under Rosetta that bash reports `uname -m` =
              # `x86_64` on an Apple Silicon host, so the old check took
              # the `else` branch and selected `x86_64-apple-darwin` — a
              # target nightly has no std for, failing the fuzz build with
              # E0463 "can't find crate for `core`". `rustc -vV`'s `host:`
              # line reflects the real toolchain arch regardless of the
              # shell, yielding `aarch64-apple-darwin` on Apple Silicon
              # (and `x86_64-apple-darwin` on a genuine Intel host).
              host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
              echo "target=${host:-aarch64-apple-darwin}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported RUNNER_OS=$RUNNER_OS for fuzz" >&2
              exit 1
              ;;
          esac

      - name: Smoke fuzz_normalize (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_normalize -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_trigrams (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_trigrams -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_extract_trigrams (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_extract_trigrams -- -max_total_time=60
        working-directory: fuzz
      # Phase 15 task 00099 — grammar-aware Cypher fuzzing. Three more
      # targets sharing the `cypher_grammar.rs` generator; their invariants
      # are also replayed on every PR by the stable
      # `tests/cypher_fuzz_harness_tests.rs` (so a regression is caught even
      # when this nightly job is skipped).
      - name: Smoke fuzz_cypher_lexer (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_cypher_lexer -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_cypher_parser (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_cypher_parser -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_cypher_grammar (60s)
        run: |
          set -euo pipefail
          cargo fuzz run --target ${{ steps.fuzz_target.outputs.target }} \
            fuzz_cypher_grammar -- -max_total_time=60
        working-directory: fuzz
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
