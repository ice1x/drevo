name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Phase 8 task 00049 — Kubernetes manifests under `k8s/`.
  # Phase 8 task 00050 — Kustomize overlays under `k8s/overlays/<env>/`.
  #
  # Three checks, all server-less (no live cluster, no kubeconfig):
  #   1. `kubectl kustomize k8s/` resolves the top-level wrapper, which
  #      forwards to `k8s/base/`.
  #   2. `kubectl kustomize k8s/base/` resolves the base directly.
  #   3. `kubectl kustomize k8s/overlays/<env>/` resolves each per-env
  #      overlay — catches a renamed base manifest, a broken `../../base/`
  #      reference, an unresolved patch target, or a kustomize-syntax
  #      slip in any overlay before it reaches a real cluster.
  #
  # The text-level `k8s_manifests_tests.rs` + `k8s_overlays_tests.rs`
  # suites already run in the `test` job above; this job adds the
  # structural pass that text matching cannot do (object graph
  # resolution, patch target verification).
  k8s:
    name: K8s manifests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: kubectl kustomize k8s/ (wrapper + base + overlays)
        run: |
          kubectl version --client=true
          for target in k8s/ k8s/base/ k8s/overlays/dev/ k8s/overlays/prod/; do
            echo "::group::kubectl kustomize $target"
            kubectl kustomize "$target" > "/tmp/$(basename "$target").yaml"
            # Fail the job if kustomize printed any warning/error to stderr.
            if kubectl kustomize "$target" 2>&1 1>/dev/null | grep -i 'warning\|error'; then
              echo "kubectl kustomize $target emitted warnings/errors above — fix before merge" >&2
              exit 1
            fi
            wc -l "/tmp/$(basename "$target").yaml"
            echo "::endgroup::"
          done

  # Phase 9 task 00060 — rustdoc for all public APIs.
  #
  # Runs `cargo doc --no-deps --all-features` under
  # `RUSTDOCFLAGS=-D warnings` so a missing rustdoc on any new `pub`
  # item OR a broken intra-doc link fails the build. `src/lib.rs`
  # carries `#![warn(missing_docs)]`; without the `-D warnings` env
  # var the warning would print and the build would still pass.
  doc:
    name: Doc
    runs-on: self-hosted
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # Audit task 00113 — MSRV is declared in `Cargo.toml` (`rust-version`)
  # and locked in by `tests/crosscut_audit_tests.rs::cargo_toml_declares_rust_version`.
  # This job exercises that exact toolchain so the field cannot decay.
  msrv:
    name: MSRV
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          v=$(awk -F'"' '/^rust-version/ {print $2}' Cargo.toml)
          if [ -z "$v" ]; then
            echo "Cargo.toml is missing rust-version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      - run: cargo check --no-default-features --features wasm --target wasm32-unknown-unknown
        # The wasm sanity check is the cheapest way to catch a future MSRV
        # bump on `getrandom/wasm_js` (audit 00111 / 00113 cross-link).

  # Phase 9 task 00058 — coverage-guided fuzz smoke run for the FTS
  # tokenizer. cargo-fuzz needs nightly Rust + libFuzzer; the job is
  # therefore split out from the main matrix (stable Rust is enough for
  # everything else) and time-boxed to ~60 seconds per target so it
  # stays under the free CI budget. The stable-CI replay of the seed
  # corpus is already run by the `test` job above through
  # `tests/fts_tokenizer_fuzz_harness_tests.rs` — this job extends that
  # coverage with libFuzzer's branch-feedback mutator on every push.
  fuzz:
    name: Fuzz
    runs-on: self-hosted
    # Skip the job entirely on non-Linux runners. The fuzz harness
    # forces `--target x86_64-unknown-linux-gnu` because libFuzzer +
    # AddressSanitizer require glibc (the taiki-e prebuilt cargo-fuzz
    # binary is musl-static, which ASan rejects with "sanitizer is
    # incompatible with statically linked libc"). That target cannot
    # be cross-compiled from Apple Silicon without a full Linux
    # toolchain install — and there is no sane way to do that on a
    # personal CI runner. The stable-CI replay of the seed corpus in
    # `tests/fts_tokenizer_fuzz_harness_tests.rs` (which runs as part
    # of the `test` job above on every host OS) keeps the regression
    # gate. When a Linux runner is added to the self-hosted fleet,
    # this job will pick up automatically.
    if: runner.os == 'Linux'
    # Don't block merges if cargo-fuzz finds a crash — surface it as a
    # CI annotation and let humans triage. The stable harness replay in
    # the `test` job remains a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Pull a prebuilt cargo-fuzz binary from the GitHub release page
      # via `taiki-e/install-action`. Compiling cargo-fuzz from source
      # with `cargo install cargo-fuzz --locked` is fragile on modern
      # nightly: cargo-fuzz 0.13.x pins an old `rustix 0.36.x` that uses
      # the now-rejected `cfg_attr(rustc_attrs, rustc_layout_scalar_…)`
      # syntax and fails to build. Prebuilt binaries side-step the
      # transitive-dep churn entirely and finish in seconds instead of
      # minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Every `cargo fuzz run` below pins `--target x86_64-unknown-linux-gnu`
      # explicitly. The taiki-e prebuilt cargo-fuzz binary is itself built
      # for `x86_64-unknown-linux-musl` (portable, statically-linked) and
      # therefore reports musl as its "host target" — which cargo-fuzz
      # then passes to `cargo build`. AddressSanitizer is incompatible
      # with statically-linked libc (`error: sanitizer is incompatible
      # with statically linked libc, disable it using `-C
      # target-feature=-crt-static``), so we override the target back to
      # glibc. The runner is ubuntu-latest, which has the gnu target
      # pre-installed; no extra `rustup target add` step is needed.
      - name: Smoke fuzz_normalize (60s)
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_normalize -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_trigrams (60s)
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_trigrams -- -max_total_time=60
        working-directory: fuzz
      - name: Smoke fuzz_extract_trigrams (60s)
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_extract_trigrams -- -max_total_time=60
        working-directory: fuzz
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
