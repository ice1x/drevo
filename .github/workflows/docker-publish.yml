# Phase 8 task 00051 — build and publish the drevo container image
# to GitHub Container Registry (`ghcr.io/ice1x/drevo`).
#
# Triggers (release-only — NOT on every push to main):
#   * push of a `v*` git tag   → publishes `MAJOR.MINOR.PATCH` + `MAJOR.MINOR`
#                                + `latest` + `sha-<short>`. This is what
#                                `make release` fires.
#   * workflow_dispatch        → manual re-publish from the Actions UI; useful
#                                for a hotfix rebuild without a code change.
#
# Why not on every push to `main` (changed 2026-07-30): back then the
# workflow ran on the single self-hosted Apple Silicon runner, where the
# `linux/amd64` cell of the multi-arch build ran under QEMU (~40 min) and
# serialised behind / blocked every other job on EVERY merge. The image is
# a release artifact, not a per-merge one, so it publishes on release tags
# only. (The workflow now runs GitHub-hosted on `ubuntu-latest` — see the
# `runs-on:` note below — so `linux/amd64` is NATIVE and only `linux/arm64`
# is emulated under QEMU; a per-merge multi-arch build is still redundant
# work, so this stays release-only.) `:latest` tracks the newest release tag.
#
# Why no `pull_request:` trigger
# ------------------------------
# Earlier revisions of this workflow ran on `pull_request` to provide
# "Dockerfile feedback in CI" by building (not pushing) the multi-arch
# image on every PR. Back on the self-hosted Apple Silicon runner the
# `linux/amd64` half of the matrix ran under QEMU emulation and the
# end-to-end build cumulated to ~19 minutes per PR. That cost duplicates
# what `ci.yml`'s `test` + `check` + `clippy` jobs already do — they
# compile the same Rust crate against the same dependency tree — and
# adds value only when a change touches `Dockerfile` itself, which is
# rare (the Dockerfile has changed twice in the last 200 commits).
# Removing the trigger reclaims those minutes for every PR; the
# Dockerfile regression caught by a PR-time multi-arch build is instead
# caught by the very next push-to-main build, which is the same image
# that would have been published. If a PR genuinely needs to validate
# the Docker image before merge, use `workflow_dispatch` from the
# Actions UI on the PR's branch.
#
# Token surface (least-privilege):
#   * contents: read   — checkout needs it; nothing more
#   * packages: write  — publish to ghcr.io under `ice1x/drevo`
#   No `actions: write`, no `id-token: write` — re-add only when a future
#   task introduces cosign / SLSA signing.
#
# Architecture matrix: `linux/amd64,linux/arm64`. amd64 is the canonical
# x86_64 server target; arm64 is the project's developer baseline (Apple
# Silicon, see README "Performance Targets") AND increasingly common in
# production K8s nodes (Graviton, Ampere). QEMU emulates arm64 on the
# amd64 runner; buildx orchestrates the cross-arch build.
#
# Tag derivation is fully delegated to `docker/metadata-action`:
#   * `type=sha`                                  → `sha-<short>` (immutable)
#   * `type=ref,event=branch`                     → `main` on default-branch builds
#   * `type=semver,pattern={{version}}`           → `0.1.0` from tag `v0.1.0`
#   * `type=semver,pattern={{major}}.{{minor}}`   → `0.1`   from tag `v0.1.0`
#   * `type=raw,value=latest,enable=<v-tag>`      → `latest` on `v*` tags
#                                                 (the newest release)
# Hand-rolled tag logic in shell drifts from semver — never extend this.
#
# Verification: every wire-format invariant above is pinned by
# `tests/docker_publish_ci_tests.rs`. Editing the workflow without
# updating the tests will break `cargo test`.

name: Docker Publish

# Trigger: release tags (`v*`) + manual `workflow_dispatch` ONLY.
#
# The image is intentionally NOT built on every push to `main`. The multi-arch
# build (linux/amd64 native + linux/arm64 under QEMU emulation on the
# ubuntu-latest runner) is minutes-heavy, so it stays a release artifact rather
# than a per-merge one: `make release` (which pushes a `vX.Y.Z` tag) is what
# publishes it. `:latest` tracks the newest release tag (see the metadata step),
# and ops can rebuild any ref on demand via `workflow_dispatch`. Because there is
# no `push:main` trigger, there is no `paths-ignore` to keep in sync — a tag
# build always runs. The job runs GitHub-hosted (see the `runs-on:` note below)
# so it never blocks the single self-hosted CI/fuzz runner.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ice1x/drevo
  # The registry the deploy (compose / run-drevo) actually pulls from. CI
  # publishes the SAME multi-arch image here so `linux/amd64` lands where it is
  # used — previously Docker Hub got only a local `docker build` from the Apple
  # Silicon Mac (arm64-only), hence "no images found for arch amd64".
  DOCKERHUB_IMAGE: docker.io/ice1x/drevo

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & publish (ghcr.io + Docker Hub)
    # GitHub-hosted, NOT self-hosted. This is a tag-only release artifact that
    # nobody waits on synchronously; running it on the single self-hosted runner
    # monopolised it for the whole multi-arch build (~40-60 min on a cold run),
    # serialising and stalling every PR's CI behind each release tag. On
    # ubuntu-latest the build runs on an ephemeral GitHub runner in parallel, so
    # it NEVER blocks the self-hosted CI/fuzz runner again. Trade-off: a cold
    # multi-arch build (linux/arm64 under QEMU) is slower here than a warm
    # self-hosted run, but the `cache-from/to: type=gha` layer cache below keeps
    # it bounded, and releases are infrequent so the GitHub-minutes cost is
    # small. Locked by
    # `tests/ci_self_hosted_runner_tests.rs::docker_publish_job_must_be_github_hosted`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so the no-op guard below can resolve the
          # previous release tag and compare commits.
          fetch-depth: 0

      # Refuse to publish a duplicate: if the release tag being built points at
      # the SAME commit as the previous release tag, there is no source change
      # and the resulting image would be identical bar its version/build-date
      # (the "cut v0.0.28 on the same commit as v0.0.27" case). This mirrors the
      # local guard in scripts/release.sh so the CI-cut path is protected too.
      # Skipped for workflow_dispatch (a deliberate manual re-publish).
      - name: Refuse a no-op release (tag with no source change)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          cur="${GITHUB_REF_NAME}"
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                 | grep -vFx "$cur" | head -n1 || true)
          if [ -n "$prev" ] && \
             [ "$(git rev-list -n1 "$cur")" = "$(git rev-list -n1 "$prev")" ]; then
            echo "::error::$cur points at the same commit as $prev — no source change since the last release; refusing to publish a duplicate image. Use workflow_dispatch to force a rebuild."
            exit 1
          fi
          echo "no-op guard: $cur is ahead of ${prev:-<no previous tag>} — publishing."

      # Authenticate to BOTH registries by pre-baking a base64 `auths` blob into
      # a per-run DOCKER_CONFIG, rather than using `docker/login-action`.
      #
      # Why pre-baked auths (not `docker login`)
      # ----------------------------------------
      # Reading auths straight from the config file invokes no credential helper,
      # so the push works on any runner without a credsStore. (This originally
      # mattered on the retired self-hosted Apple Silicon Mac, where Docker
      # Desktop re-injected `credsStore: osxkeychain` even into a `{}` config and
      # `docker login` failed headless with `-25308`; on today's GitHub-hosted
      # ubuntu-latest there is no keychain, but the pre-baked approach stays —
      # it is simpler, needs no extra action, and keeps buildx's config
      # co-located so the post-job `docker buildx rm` finds it.)
      #
      # Two auths are baked: ghcr.io (GITHUB_TOKEN) and Docker Hub
      # (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets, keyed under the canonical
      # `https://index.docker.io/v1/` registry). On pull_request nothing is
      # pushed, so an empty config is fine; the build step still validates.
      #
      # Pinned by
      # `tests/ci_self_hosted_runner_tests.rs::docker_publish_overrides_docker_config_to_avoid_macos_keychain`.
      - name: Set up ephemeral DOCKER_CONFIG with registry auth (no keychain)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          DC="${RUNNER_TEMP:-/tmp}/docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DC"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            ghcr_auth=$(printf '%s' "${GHCR_USER}:${GHCR_TOKEN}" | base64 | tr -d '\n')
            dh_auth=$(printf '%s' "${DOCKERHUB_USER}:${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')
            printf '{"auths":{"%s":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' \
              "$REGISTRY" "$ghcr_auth" "$dh_auth" > "$DC/config.json"
          else
            printf '{}' > "$DC/config.json"
          fi
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      # QEMU first — buildx needs the binfmt_misc handlers registered
      # before it spawns the arm64 builder container.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No `docker login` step — GHCR auth is pre-baked into DOCKER_CONFIG
      # above (avoids the macOS keychain credsStore). On pull_request nothing
      # is pushed, so the absent auth is fine; the build step still validates
      # the image.

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Same tag set for both registries: ghcr.io (canonical, K8s pins it)
          # and Docker Hub (what the compose/run deploy pulls). build-push below
          # pushes the one multi-arch build to every resulting tag.
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `:latest` now tracks the newest RELEASE (this workflow only
            # runs on `v*` tags + dispatch), so gate it on a version tag
            # rather than the default branch.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend keeps amd64 + arm64 layers warm
          # across runs without paying egress to GHCR. Scope so the
          # publish job's cache stays separate from any future test job.
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,scope=docker-publish,mode=max
