# Phase 8 task 00051 — build and publish the drevo container image
# to GitHub Container Registry (`ghcr.io/ice1x/drevo`).
#
# Triggers:
#   * push to `main`           → publishes `latest` + `sha-<short>` + `main`
#   * push of a `v*` git tag   → publishes `MAJOR.MINOR.PATCH` + `MAJOR.MINOR`
#                                + `sha-<short>`
#   * workflow_dispatch        → manual re-publish from the Actions UI; useful
#                                for cutting a hotfix tag rebuild without a
#                                code change.
#
# Why no `pull_request:` trigger
# ------------------------------
# Earlier revisions of this workflow ran on `pull_request` to provide
# "Dockerfile feedback in CI" by building (not pushing) the multi-arch
# image on every PR. On the self-hosted Apple Silicon runner the
# `linux/amd64` half of the matrix runs under QEMU emulation and the
# end-to-end build cumulates to ~19 minutes per PR. That cost duplicates
# what `ci.yml`'s `test` + `check` + `clippy` jobs already do — they
# compile the same Rust crate against the same dependency tree — and
# adds value only when a change touches `Dockerfile` itself, which is
# rare (the Dockerfile has changed twice in the last 200 commits).
# Removing the trigger reclaims those minutes for every PR; the
# Dockerfile regression caught by a PR-time multi-arch build is instead
# caught by the very next push-to-main build, which is the same image
# that would have been published. If a PR genuinely needs to validate
# the Docker image before merge, use `workflow_dispatch` from the
# Actions UI on the PR's branch.
#
# Token surface (least-privilege):
#   * contents: read   — checkout needs it; nothing more
#   * packages: write  — publish to ghcr.io under `ice1x/drevo`
#   No `actions: write`, no `id-token: write` — re-add only when a future
#   task introduces cosign / SLSA signing.
#
# Architecture matrix: `linux/amd64,linux/arm64`. amd64 is the canonical
# x86_64 server target; arm64 is the project's developer baseline (Apple
# Silicon, see README "Performance Targets") AND increasingly common in
# production K8s nodes (Graviton, Ampere). QEMU emulates arm64 on the
# amd64 runner; buildx orchestrates the cross-arch build.
#
# Tag derivation is fully delegated to `docker/metadata-action`:
#   * `type=sha`                                  → `sha-<short>` (immutable)
#   * `type=ref,event=branch`                     → `main` on default-branch builds
#   * `type=semver,pattern={{version}}`           → `0.1.0` from tag `v0.1.0`
#   * `type=semver,pattern={{major}}.{{minor}}`   → `0.1`   from tag `v0.1.0`
#   * `type=raw,value=latest,enable=is_default_branch`
#                                                 → `latest` only on `main`
# Hand-rolled tag logic in shell drifts from semver — never extend this.
#
# Verification: every wire-format invariant above is pinned by
# `tests/docker_publish_ci_tests.rs`. Editing the workflow without
# updating the tests will break `cargo test`.

name: Docker Publish

# Docs-only changes bypass this workflow via `paths-ignore`. The set
# MUST stay byte-identical to ci.yml's and cross-compile.yml's
# paths-ignore set — locked by
# `tests/ci_self_hosted_runner_tests.rs::heavy_workflows_share_docs_only_paths_ignore`.
# Without this filter, a README-only push to `main` would still trigger
# the linux/amd64 + linux/arm64 multi-arch build via QEMU (~20-30 min
# under emulation), consuming runner time and adding nothing — the
# Docker image cannot meaningfully change when only docs do.
# `push` to tags (`v*`) is intentionally NOT filtered: a release tag
# always rebuilds the image regardless of what files changed in the
# tagged commit.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'audit/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ice1x/drevo

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & publish (ghcr.io)
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use an ephemeral DOCKER_CONFIG so `docker login` does NOT write
      # through the macOS osxkeychain credsStore.
      #
      # Why this step exists
      # --------------------
      # The project's self-hosted runner is an Apple Silicon Mac. Docker
      # Desktop on macOS ships `~/.docker/config.json` with
      # `"credsStore": "desktop"` (which delegates to `osxkeychain`).
      # `docker/login-action` shells out to `docker login`, which then
      # tries to write the GHCR credential through that credsStore.
      # Writing to the Keychain requires an unlocked GUI session, so on
      # a headless runner the call fails with:
      #
      #   Error saving credentials: error storing credentials - err: exit
      #   status 1, out: `User interaction is not allowed. (-25308)`
      #
      # Docker Publish was red on every push to main from before #90
      # through bce8ade because of this exact error.
      #
      # NOTE: a `{}` (or `{"credsStore":""}`) config does NOT help — Docker
      # Desktop RE-INJECTS `credsStore: osxkeychain` on `docker login`. Fix:
      # skip `docker login` entirely and pre-bake the base64 `auths` blob into
      # the per-run DOCKER_CONFIG below; reading auths from the file invokes no
      # credential helper, so the Keychain is never touched.
      # Placed BEFORE buildx setup so the buildx instance also lives
      # inside DOCKER_CONFIG and the post-job `docker buildx rm` step
      # finds it without falling back to the user config.
      #
      # Pinned by
      # `tests/ci_self_hosted_runner_tests.rs::docker_publish_overrides_docker_config_to_avoid_macos_keychain`.
      - name: Set up ephemeral DOCKER_CONFIG with GHCR auth (no keychain)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          DC="${RUNNER_TEMP:-/tmp}/docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DC"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            auth=$(printf '%s' "${GHCR_USER}:${GHCR_TOKEN}" | base64 | tr -d '\n')
            printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > "$DC/config.json"
          else
            printf '{}' > "$DC/config.json"
          fi
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      # QEMU first — buildx needs the binfmt_misc handlers registered
      # before it spawns the arm64 builder container.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No `docker login` step — GHCR auth is pre-baked into DOCKER_CONFIG
      # above (avoids the macOS keychain credsStore). On pull_request nothing
      # is pushed, so the absent auth is fine; the build step still validates
      # the image.

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend keeps amd64 + arm64 layers warm
          # across runs without paying egress to GHCR. Scope so the
          # publish job's cache stays separate from any future test job.
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,scope=docker-publish,mode=max
