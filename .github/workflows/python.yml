# Phase 16 task `00122` — Python CI matrix, cibuildwheel-driven.
#
# This workflow is the **definition-of-done gate** for Phase 16
# (drevo-py Python Graph-RAG SDK). It runs the three test layers
# landed by 00118 (unit ~180+), 00119 (integration ~52), and 00120
# (e2e ~40) inside cibuildwheel's per-platform sandbox.
#
# ## Why cibuildwheel and not GHA `container:`?
#
# An earlier iteration tried to route the ubuntu cell to the
# self-hosted macOS runner via the GHA `container:` directive
# (`container: python:3.13-bookworm`). The runner-agent rejected it
# with:
#
#     ##[error]Container operations are only supported on Linux runners
#
# GHA's `container:` is implemented only in the Linux runner-agent;
# Docker availability on the macOS host doesn't help. cibuildwheel
# sidesteps that by managing `docker run` itself (it's a regular
# subprocess, not a GHA mechanism). The same trick `python-wheels.yml`
# has used since the 2026-05-27 self-hosted revert.
#
# ## Matrix shape
#
#   {platform: [macos, linux]} = 2 cells.
#
#   * macos — cibuildwheel builds natively on the self-hosted macOS
#     runner (no container).
#   * linux — cibuildwheel pulls the manylinux container image and
#     runs the entire build + test inside it ON the self-hosted
#     macOS host. Apple Virtualization Framework makes the Linux
#     container native on Apple Silicon (`linux/arm64`).
#
# Windows is intentionally NOT in the matrix: cibuildwheel cannot
# cross-build Windows wheels on a macOS host (no Win32 runtime
# available there). When a self-hosted Windows runner exists, a
# third matrix cell can be added; until then, windows coverage
# lives in `python-wheels.yml` workflow_dispatch runs only.
#
# ## CIBW_BUILD pin
#
# `cp313-*` only. drevo-py wheels are built with `abi3-py310`: a
# single binary that runs on every CPython 3.10+ interpreter
# without a recompile. Multi-minor testing would produce identical
# wheels and run identical tests — see KG decision
# `decision_python_ci_matrix_pin_to_latest_only`.
#
# ## CIBW_TEST_COMMAND
#
# Runs against the just-installed wheel in cibuildwheel's isolated
# venv. Five gates, chained with `&&`:
#
#   pytest tests/unit/      (00118)
#   pytest tests/integration/ (00119)
#   pytest tests/e2e/       (00120)
#   mypy --strict python/drevo/
#   ruff check python/ tests/
#   black --check python/ tests/
#
# `{package}` resolves to `drevo-py/` (the dir passed to
# cibuildwheel on the command line).
#
# ## Cost
#
# Both cells run on `[self-hosted, macOS]`. Zero GitHub-hosted
# billable minutes. Cold path: ~5-10 min cibuildwheel + manylinux
# pull + cargo compile + test run. Warm path benefits from
# self-hosted's persistent Docker layer cache + cargo registry
# cache.
#
# Locked from text by `tests/python_ci_matrix_tests.rs`.

name: Python CI matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'drevo-py/**'
      - '.github/workflows/python.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:

# Distinct concurrency group from `python-ci.yml`
# (`python-ci-${{ github.ref }}`) and `python-wheels.yml`
# (`python-wheels-${{ github.ref }}`).
concurrency:
  group: python-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_matrix:
    name: cibuildwheel ${{ matrix.platform }} / cp313
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    strategy:
      # Don't cancel the other cell when one fails — keeps the
      # platform-divergence signal intact.
      fail-fast: false
      matrix:
        platform: [macos, linux]
    env:
      # cibuildwheel-controlled. Same envs as python-wheels.yml so
      # the two workflows stay aligned.
      CIBW_BUILD: "cp313-*"
      CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_i686 cp*-musllinux_*"
      CIBW_BUILD_FRONTEND: "build"
      CIBW_BEFORE_ALL_LINUX: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal --default-toolchain stable
      CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120'
      CIBW_BEFORE_BUILD_MACOS: "rustup show"
      # Test dependencies installed in the wheel's isolated test
      # env (not in the wheel itself). pytest + the four gates.
      CIBW_TEST_REQUIRES: "pytest>=7 mypy ruff black faker hypothesis"
      # Run the full test suite against the just-built wheel.
      # `{package}` expands to `drevo-py/` (the dir cibuildwheel is
      # pointed at below). Each gate gets its own command so a
      # failure surfaces as a discrete step in the cibuildwheel log.
      CIBW_TEST_COMMAND: >-
        pytest -q {package}/tests/unit/ &&
        pytest -q {package}/tests/integration/ &&
        pytest -q {package}/tests/e2e/ &&
        mypy --strict {package}/python/drevo/ &&
        ruff check {package}/python/ {package}/tests/ &&
        black --check {package}/python/ {package}/tests/
      # Per-cell platform override — selects native macOS or
      # Linux-in-container.
      CIBW_PLATFORM: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # cibuildwheel can pick up a dirty-tree indicator from
          # shallow clones in some maturin paths; full history is
          # cheap on this repo.
          fetch-depth: 0

      - name: Locate system Python 3.13 on self-hosted macOS
        # `actions/setup-python@v5` cannot install into
        # `/Users/runner/hostedtoolcache/` under the self-hosted
        # runner's user (it tries to `mkdir /Users/runner`). Same
        # workaround `python-ci.yml` uses: locate the python.org-pkg
        # 3.13 binary and symlink it as `python` / `python3` in a
        # `$GITHUB_WORKSPACE/.py-shim` dir prepended to
        # `$GITHUB_PATH`. cibuildwheel uses the host's Python to
        # orchestrate; the container/wheel Python is managed by
        # cibuildwheel itself.
        shell: bash
        run: |
          for candidate in \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13" \
            "$(command -v python3.13 || true)" \
            "/opt/homebrew/bin/python3.13" \
            "/usr/local/bin/python3.13"; do
            if [ -x "$candidate" ]; then
              echo "Using $candidate ($($candidate --version))"
              mkdir -p "$GITHUB_WORKSPACE/.py-shim"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python"
              ln -sf "$candidate" "$GITHUB_WORKSPACE/.py-shim/python3"
              echo "$GITHUB_WORKSPACE/.py-shim" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::python3.13 not found on self-hosted macOS — install via the python.org pkg"
          exit 1

      - name: Set up Rust toolchain (macOS native build)
        # Only needed for the macOS cibuildwheel cell — the Linux
        # cell installs Rust INSIDE the manylinux container via
        # CIBW_BEFORE_ALL_LINUX above. Running dtolnay's action on
        # the macOS cell ensures `rustup show` (CIBW_BEFORE_BUILD_MACOS)
        # finds a toolchain.
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install --upgrade pip "cibuildwheel==2.21.3"

      - name: Run cibuildwheel (build + test wheel)
        # `drevo-py` is the package dir cibuildwheel points at —
        # contains `pyproject.toml` declaring maturin as the build
        # backend. The output dir holds the produced wheels; we
        # don't upload them (this is a test workflow, not a release
        # one), but cibuildwheel needs the path.
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse drevo-py
