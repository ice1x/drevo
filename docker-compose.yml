# drevo — Docker Compose deployment
#
# Task 00047: single-service compose file for local development and
# small single-host deployments. Builds the image from the local
# Dockerfile, publishes the HTTP API on 8080, and persists the redb
# database file in a named volume mounted at /data.
#
# Usage:
#   docker compose up -d         # build + start in background
#   docker compose logs -f       # follow logs
#   docker compose down          # stop and remove containers (volume kept)
#   docker compose down -v       # stop and wipe persistent data
#
# Note: the top-level `version:` key is intentionally omitted — modern
# Compose Spec (docker-compose v2+) treats it as obsolete.

services:
  drevo:
    build:
      context: .
      dockerfile: Dockerfile
    image: drevo:latest
    container_name: drevo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DREVO_HOST: "0.0.0.0"
      DREVO_PORT: "8080"
      DREVO_DATA_DIR: "/data"
    volumes:
      - drevo-data:/data
    healthcheck:
      # GET /health is intentionally cheap and DB-independent (task 00042),
      # so it stays green even when the DB is under contention.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  drevo-data:
    driver: local
